<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Item Selector</title>
  <script>(function(){
    var S=['light','light-hc','dark','dark-hc'];
    function apply(){try{
      var r=document.documentElement;
      var s=localStorage.getItem('vanilla-skin')||'light';
      S.forEach(function(c){r.classList.remove(c);});
      r.classList.add(S.indexOf(s)>-1?s:'light');
      if(localStorage.getItem('vanilla-cms-style')==='1'){
        r.style.setProperty('--rounded-sm','4px');
        r.style.setProperty('--rounded-md','8px');
        r.style.setProperty('--rounded-lg','16px');
      }else{
        r.style.removeProperty('--rounded-sm');
        r.style.removeProperty('--rounded-md');
        r.style.removeProperty('--rounded-lg');
      }
    }catch(e){}}
    apply();
    window.addEventListener('pageshow',apply);
  })()</script>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../tokens-high-contrast.css">
  <link rel="stylesheet" href="../tokens-dark.css">
  <link rel="stylesheet" href="../components.css">
  <script src="../icons.js"></script>

  <style>
    /* ── Page-specific composition (tokens only) ─────────────────────────── */
    :root {
      --sidebar-width: 280px;
      /* Shared chrome height: 32px toggle + 2×12px bar padding = 56px.
         Drops to 48px in the compact breakpoint below. */
      --cp-chrome-h: calc(var(--spacing-8) + 2 * var(--spacing-4));
    }
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    main { flex: 1; overflow-y: auto; min-width: 0; background: var(--color-light-l1); }

    /* ── Modern sidebar (from prototypes/modern-sidebar.html) ─────
       The Control Panel sits flush to the screen edge, full height.
       Three states: hidden (default) · sb-peek (hover the toggle) ·
       sb-pinned (click the toggle; content shifts right). */
    .control-panel--floating {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--sidebar-width);
      z-index: 50;
      border-right: 1px solid var(--color-secondary-l2);
      transform: translateX(calc(-1 * var(--spacing-7)));
      opacity: 0;
      visibility: hidden;
      transition: transform 140ms ease-out, opacity 140ms ease-out,
                  visibility 0s linear 140ms, box-shadow 140ms ease;
    }
    body.sb-pinned .control-panel--floating,
    body.sb-peek .control-panel--floating {
      transform: translateX(0);
      opacity: 1;
      visibility: visible;
      transition: transform 140ms ease-out, opacity 140ms ease-out,
                  visibility 0s, box-shadow 140ms ease;
    }
    body.sb-peek:not(.sb-pinned) .control-panel--floating { box-shadow: var(--shadow-lg); }

    /* Mobile scrim: above the content, below the panel (50) and toggle (60). */
    .cp-scrim {
      position: fixed;
      inset: 0;
      background: var(--color-scrim);
      z-index: 45;
      opacity: 0;
      visibility: hidden;
      transition: opacity 140ms ease-out, visibility 0s linear 140ms;
    }

    /* Top-bar geometry: 12px padding all round → 56px chrome band. */
    .control-menu { padding: var(--spacing-4); }
    .control-menu__btns { position: relative; z-index: 60; }
    .control-menu__left { gap: var(--spacing-3); }
    .control-menu__btn { border-radius: var(--rounded-lg); }

    /* One static toggle, content swaps by state: closed → menu icon;
       panel out (peek/pinned) → brand image at rest, menu icon on hover. */
    .cp-toggle--branded {
      width: var(--spacing-8);
      height: var(--spacing-8);
      padding: 0;
    }
    .cp-toggle__brand { background: transparent; }
    .cp-toggle__brand > .cp-toggle__brand-img--dark { display: none; }
    .dark .cp-toggle__brand > .cp-toggle__brand-img--dark,
    .dark-hc .cp-toggle__brand > .cp-toggle__brand-img--dark { display: block; }
    .dark .cp-toggle__brand > .cp-toggle__brand-img--light,
    .dark-hc .cp-toggle__brand > .cp-toggle__brand-img--light { display: none; }
    #cp-toggle .cp-toggle__brand { display: none; }
    #cp-toggle #cp-toggle-icon { display: block; }
    body.sb-pinned #cp-toggle,
    body.sb-pinned #cp-toggle:hover {
      background: color-mix(in srgb, var(--color-dark) 8%, transparent);
    }
    body.sb-peek:not(.sb-pinned) #cp-toggle .cp-toggle__brand { display: inline-flex; }
    body.sb-peek:not(.sb-pinned) #cp-toggle #cp-toggle-icon { display: none; }
    body.sb-peek:not(.sb-pinned) #cp-toggle:hover .cp-toggle__brand,
    body.sb-peek:not(.sb-pinned) #cp-toggle:focus-visible .cp-toggle__brand { display: none; }
    body.sb-peek:not(.sb-pinned) #cp-toggle:hover #cp-toggle-icon,
    body.sb-peek:not(.sb-pinned) #cp-toggle:focus-visible #cp-toggle-icon { display: block; }

    /* Panel header locked to the control-menu band; left padding clears the
       stationary toggle (12 + 32 + 8 = 52px). */
    .control-panel--floating .control-panel__header {
      height: var(--cp-chrome-h);
      padding: 0 var(--spacing-4) 0 calc(var(--spacing-10) + var(--spacing-2));
    }
    .control-panel--floating .control-panel__search {
      padding-top: var(--spacing-4);
      padding-left: var(--spacing-6);
      padding-right: var(--spacing-6);
    }
    .control-panel--floating .control-panel__search .input__field {
      height: var(--spacing-8);
      padding-left: var(--spacing-4);
    }
    .control-panel--floating .control-panel__groups { gap: var(--spacing-3); }
    .control-panel--floating .control-panel__group-header { padding-right: var(--spacing-6); }

    /* Modern scrollbar: thin floating pill, no track. */
    .control-panel__body,
    main {
      scrollbar-width: thin;
      scrollbar-color: var(--color-secondary-l2) transparent;
    }
    .control-panel__body::-webkit-scrollbar,
    main::-webkit-scrollbar { width: var(--spacing-3); }
    .control-panel__body::-webkit-scrollbar-track,
    main::-webkit-scrollbar-track { background: transparent; }
    .control-panel__body::-webkit-scrollbar-thumb,
    main::-webkit-scrollbar-thumb {
      background: var(--color-secondary-l2);
      background-clip: padding-box;
      border: var(--spacing-1) solid transparent;
      border-radius: var(--rounded-full);
    }
    .control-panel__body::-webkit-scrollbar-thumb:hover,
    main::-webkit-scrollbar-thumb:hover {
      background-color: var(--color-secondary-l0);
      background-clip: padding-box;
    }

    /* Pinned: page content and Control Menu title make room. */
    main { transition: margin-left 320ms cubic-bezier(0.22, 1, 0.36, 1); }
    body.sb-pinned main { margin-left: var(--sidebar-width); }
    .control-menu__title { transition: margin-left 320ms cubic-bezier(0.22, 1, 0.36, 1); }
    body.sb-pinned .control-menu__title {
      margin-left: calc(var(--sidebar-width) - var(--spacing-8));
    }

    /* Pinned user footer + scroll shadows. */
    .control-panel__footer {
      flex-shrink: 0;
      padding: var(--spacing-3);
      position: relative;
      z-index: 1;
      transition: box-shadow 150ms ease;
    }
    .control-panel__search {
      position: relative;
      z-index: 1;
      transition: box-shadow 150ms ease;
    }
    #control-panel.is-clipped-top .control-panel__search { box-shadow: var(--shadow-scroll-top); }
    #control-panel.is-clipped-bottom .control-panel__footer { box-shadow: var(--shadow-scroll-bottom); }

    .cp-user { position: relative; }
    .cp-user__trigger {
      align-items: center;
      appearance: none;
      background: none;
      border: 0;
      border-radius: var(--rounded-lg);
      color: var(--color-dark);
      cursor: pointer;
      display: inline-flex;
      font-family: var(--font-family-base);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semi);
      gap: var(--spacing-3);
      padding: var(--spacing-3);
      text-align: left;
    }
    .cp-user__trigger:hover { background: var(--color-light); }
    .cp-user.is-open .cp-user__trigger {
      background: color-mix(in srgb, var(--color-dark) 8%, transparent);
    }
    .cp-user__avatar {
      border-radius: var(--rounded-full);
      flex-shrink: 0;
      height: var(--spacing-7);
      overflow: hidden;
      width: var(--spacing-7);
    }
    .cp-user__avatar > img {
      display: block;
      height: 100%;
      object-fit: cover;
      width: 100%;
    }
    .cp-user__name { white-space: nowrap; }
    .cp-user__caret {
      color: var(--color-secondary-l0);
      flex-shrink: 0;
      transition: transform 150ms ease;
    }
    .cp-user__trigger[aria-expanded="true"] .cp-user__caret { transform: rotate(180deg); }
    .cp-user__menu {
      position: absolute;
      bottom: calc(100% + var(--spacing-2));
      left: 0;
      right: 0;
      max-height: 70vh;
      overflow-y: auto;
      border-radius: var(--rounded-lg);
      z-index: 30;
    }
    .cp-user:not(.is-open) .cp-user__menu { display: none; }

    /* Compact chrome breakpoint: 48px band, overlay-only pinning + scrim. */
    @media (max-width: 767px) {
      :root { --cp-chrome-h: calc(var(--spacing-8) + 2 * var(--spacing-3)); }
      .control-menu { padding: var(--spacing-3); }
      .control-panel--floating .control-panel__header {
        padding: 0 var(--spacing-3) 0 var(--spacing-10);
      }
      .control-panel--floating .control-panel__search {
        padding-left: var(--spacing-4);
        padding-right: var(--spacing-4);
      }
      body.sb-pinned main { margin-left: 0; }
      body.sb-pinned .control-menu__title { margin-left: 0; }
      body.sb-pinned .cp-scrim {
        opacity: 1;
        visibility: visible;
        transition: opacity 140ms ease-out, visibility 0s;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .control-panel--floating, main, .control-menu__title { transition: none; }
    }

    /* Header action buttons: theme switch + hidden-until-focus Close. */
    .control-panel__actions {
      align-items: center;
      display: flex;
      flex-shrink: 0;
      gap: var(--spacing-2);
      margin-left: auto;
    }
    .control-panel__actions .btn { border-radius: var(--rounded-lg); }
    .control-panel__close { order: 1; }
    .control-panel__close:not(:focus-visible) {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .control-panel:focus { outline: none; }

    /* Hover / keyboard-focus tooltip (reuses the .tooltip component). */
    .cp-tip { position: relative; display: inline-flex; }
    .cp-tip__bubble {
      position: absolute;
      top: calc(100% + var(--spacing-2));
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
      z-index: 20;
    }
    .cp-tip:hover .cp-tip__bubble,
    .cp-tip:has(:focus-visible) .cp-tip__bubble { opacity: 1; }
    #cp-toggle-tip { left: var(--spacing-2); transform: none; }
    #cp-toggle-tip { opacity: 0; }
    #cp-toggle-tip.is-visible { opacity: 1; }

    /* Rail items are kit <li> rows; give keyboard focus the kit ring */
    .selector-rail .vert-nav__item:focus-visible { outline: 0; box-shadow: var(--focus-ring); }

    /* This prototype drops the kit's underlined titles inside the selector */
    .selector-modal .card__title,
    .selector-modal .list__title { text-decoration: none; }

    /* Fake Page Builder backdrop */
    .pb-canvas { display: grid; grid-template-columns: 220px 1fr; gap: var(--spacing-6);
                 padding: var(--spacing-6); max-width: 1280px; margin: 0 auto; }
    .pb-panel { background: var(--color-white); border: 1px solid var(--color-secondary-l3);
                border-radius: var(--rounded-md); padding: var(--spacing-6); }
    .pb-main { display: flex; flex-direction: column; gap: var(--spacing-5); min-width: 0; }
    .pb-field-label { font-size: var(--font-size-xs); font-weight: var(--font-weight-bold);
                      text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-primary); }
    .pb-field { display: flex; align-items: center; gap: var(--spacing-4);
                margin-top: var(--spacing-3); padding: var(--spacing-4);
                border: 1px dashed var(--color-primary); border-radius: var(--rounded-sm);
                background: var(--color-primary-l3); }
    .pb-field-value { font-size: var(--font-size-sm); font-weight: var(--font-weight-semi);
                      color: var(--color-dark); min-width: 0; overflow-wrap: anywhere; }
    .pb-field-value.is-empty { font-weight: var(--font-weight-normal); font-style: italic;
                               color: var(--color-dark); opacity: 0.55; }

    /* Modal sizing for the composite selector (base .modal caps at 600px) */
    .modal-overlay[hidden] { display: none; }
    .selector-modal { max-width: 1080px; height: calc(100vh - var(--spacing-10) * 2); max-height: 700px; }
    .selector-modal .modal__body { padding: 0; display: flex; flex: 1 1 auto; min-height: 0; }

    /* Left rail */
    .selector-rail { width: 200px; flex-shrink: 0; background: var(--color-light-l1);
                     padding: var(--spacing-4) 0; overflow-y: auto; }

    /* Right panel */
    .selector-panel { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
    .selector-toolbar { flex-shrink: 0; }

    /* CMS breadcrumb control bar — always present, above the FDS block
       (filters + list). The root crumb doubles as the context switcher. */
    .selector-crumbs { padding: var(--spacing-5) var(--spacing-6) var(--spacing-4);
                       border-bottom: 1px solid var(--color-secondary-l3); flex-shrink: 0; }
    /* Neutralise the kit picker's stretch (min-width 109 + trigger 100% +
       space-between) so the pill hugs its content and the caret stays inside.
       The negative margins cancel the padding, so the breadcrumb's own item
       gap is preserved exactly. */
    .selector-crumbs .js-picker { display: inline-flex; min-width: 0; }
    .selector-ctx-trigger {
      display: inline-flex; align-items: center; gap: var(--spacing-2);
      width: auto; justify-content: flex-start;
      background: transparent; border: 0; cursor: pointer;
      font-family: var(--font-family-base);
      font-size: var(--font-size-lg);
      font-weight: inherit;
      line-height: var(--line-height-base);
      color: inherit;
      padding: 1px var(--spacing-2); margin: -1px calc(-1 * var(--spacing-2));
      border-radius: var(--rounded-sm);
      white-space: nowrap;
    }
    .selector-ctx-trigger:hover { background: var(--color-light-l1); }
    .selector-ctx-trigger:focus-visible { outline: 0; box-shadow: var(--focus-ring); }
    .selector-ctx-trigger .lexicon-icon { color: var(--color-secondary); flex-shrink: 0; }

    /* Filter row at the top of the context dropdown (many contexts) */
    .selector-ctx-filter { padding: var(--spacing-3) var(--spacing-4) var(--spacing-4);
                           border-bottom: 1px solid var(--color-secondary-l3);
                           margin-bottom: var(--spacing-2); }
    .selector-ctx-filter .input__field { height: var(--spacing-8); }
    /* The caption inherits the breadcrumb's 18px bold — reset it and give it
       the same inset as the dropdown items. */
    .selector-ctx-empty { padding: var(--spacing-3) var(--spacing-5);
                          font-size: var(--font-size-sm);
                          font-weight: var(--font-weight-normal);
                          white-space: nowrap; }
    .selector-ctx-empty[hidden] { display: none; }
    .selector-ctx-list { list-style: none; margin: 0; padding: 0;
                         max-height: 280px; overflow-y: auto; }
    .selector-ctx-list > li[hidden] { display: none; }
    /* Flex column so short content still fills the container and the
       pagination lands at the bottom (in-flow, not fixed). */
    .selector-scroll { position: relative; flex: 1 1 auto; overflow-y: auto; min-height: 0;
                       display: flex; flex-direction: column;
                       padding: var(--spacing-4) var(--spacing-6) var(--spacing-6); }
    /* Children must overflow (and scroll), never compress — the framed list
       clips its rows if it is allowed to shrink. */
    .selector-scroll > * { flex-shrink: 0; }
    .selector-group-label { display: block; margin: var(--spacing-4) 0 var(--spacing-3);
                            font-size: var(--font-size-xs); font-weight: var(--font-weight-bold);
                            text-transform: uppercase; letter-spacing: 0.06em;
                            color: var(--color-secondary); }
    /* Pagination flows with the FDS content (no divider — Clay has none;
       it is reached by scrolling). margin-top: auto bottom-aligns it when
       the content is shorter than the container. */
    .selector-pagination { padding-top: var(--spacing-5); margin-top: auto; }

    /* Folder rows are click targets; compact rows centre vertically so the
       sticker and the drill chevron align with the two text lines. */
    .folder-row { cursor: pointer; align-items: center; }
    .folder-row .list__content { padding-top: 0; gap: 0; }
    .folder-row .list__title { pointer-events: none; }

    /* Asset cards grid */
    .selector-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                     gap: var(--spacing-5); }
    .asset-card { cursor: pointer; }
    .asset-card:hover { border-color: var(--color-primary-l1); }
    /* More breathing room for the selection checkbox (kit default is 8px) */
    .asset-card .card__select { top: var(--spacing-5); left: var(--spacing-5); }
    .asset-card .card__media { position: relative; }
    .asset-card__author { position: absolute; left: var(--spacing-5); bottom: var(--spacing-5);
                          background: var(--color-white);
                          border: 1px solid var(--color-secondary-l3);
                          color: var(--color-success-l1); }

    /* Pickers (trigger + kit dropdown) */
    .js-picker { position: relative; }
    .js-picker .dropdown { position: absolute; top: calc(100% + var(--spacing-2)); left: 0;
                           z-index: 30; display: none; min-width: 220px; }
    .js-picker.is-open .dropdown { display: block; }

    /* Drag & drop overlay */
    .selector-dropzone { position: absolute; inset: var(--spacing-3); z-index: 5;
                         display: none; flex-direction: column; align-items: center;
                         justify-content: center; gap: var(--spacing-4); text-align: center;
                         border: 2px dashed var(--color-primary); border-radius: var(--rounded-md);
                         background: var(--color-primary-l3); color: var(--color-primary);
                         font-size: var(--font-size-sm); font-weight: var(--font-weight-semi);
                         pointer-events: none; }
    .selector-dropzone.is-active { display: flex; }

    /* URL tab */
    .selector-url-form { padding: var(--spacing-8); max-width: 480px;
                         display: flex; flex-direction: column; gap: var(--spacing-6); }
    .selector-preview { height: 240px; border: 1px solid var(--color-secondary-l3);
                        border-radius: var(--rounded-md); background: var(--color-light-l1);
                        display: flex; align-items: center; justify-content: center;
                        overflow: hidden; }
    .selector-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .selector-preview img[hidden] { display: none; }

    /* Modal footer: selection info on the left. With a selection it takes the
       management-toolbar--active treatment (primary tint), but with the blue
       border on TOP. */
    .selector-footer-info { margin-right: auto; display: flex; align-items: center;
                            gap: var(--spacing-5); min-width: 0; }
    .selector-footer-hint { font-size: var(--font-size-sm); color: var(--color-dark); opacity: 0.55; }
    .modal__footer.is-active-selection { background: var(--color-primary-l3);
                                         border-top-color: var(--color-primary); }
    .selector-footer-text { font-size: var(--font-size-sm); color: var(--color-secondary);
                            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .selector-footer-text strong { color: var(--color-dark); }

    /* Toast + reopen affordance */
    .selector-toast { position: fixed; left: 50%; bottom: var(--spacing-8);
                      transform: translateX(-50%); z-index: 2000; box-shadow: var(--shadow-lg); }
    .selector-toast[hidden] { display: none; }
    .reopen-wrap { position: fixed; inset: 0; z-index: 900; display: flex;
                   align-items: center; justify-content: center; pointer-events: none; }
    .reopen-wrap[hidden] { display: none; }
    .reopen-wrap .btn { pointer-events: auto; box-shadow: var(--shadow-lg); }
  </style>
</head>
<body>

<!-- EDIT BELOW. Compose with classes from components.css only. -->

<!-- ── Backdrop: Page Builder edit mode (context behind the modal) ── -->
<div class="control-menu">
  <div class="control-menu__left">
    <div class="control-menu__btns">
      <span class="cp-tip">
        <button class="control-menu__btn cp-toggle--branded" id="cp-toggle" type="button" aria-label="Pin Menu" aria-expanded="false" aria-controls="control-panel">
          <span class="sticker sticker--md cp-toggle__brand" aria-hidden="true">
            <img class="cp-toggle__brand-img--light" src="img/control-panel-icon.png" alt="">
            <img class="cp-toggle__brand-img--dark" src="img/control-panel-icon-dark.png" alt="">
          </span>
          <svg class="lexicon-icon" id="cp-toggle-icon"><use href="#product-menu-closed"></use></svg>
        </button>
        <span class="tooltip tooltip--top tooltip--align-start cp-tip__bubble" id="cp-toggle-tip" role="tooltip">Pin Menu</span>
      </span>
    </div>
    <span class="control-menu__title">Page Builder — Homepage (Edit mode)</span>
  </div>
  <div class="control-menu__right">
    <span class="label label--info">Draft</span>
    <button class="control-menu__btn" type="button" aria-label="Global navigation">
      <svg class="lexicon-icon"><use href="#grid"></use></svg>
    </button>
  </div>
</div>

<!-- Mobile scrim: visible below the breakpoint while the panel is pinned. -->
<div class="cp-scrim" id="cp-scrim" aria-hidden="true"></div>

<!-- ── Floating Control Panel (pattern from prototypes/modern-sidebar.html) ── -->
<aside class="control-panel control-panel--floating" id="control-panel" tabindex="-1">

  <div class="control-panel__header">
    <span class="control-panel__title">Control Panel</span>

    <div class="control-panel__actions">
      <!-- Close — first Tab stop inside the panel; CSS `order` renders it last.
           Appears only on keyboard focus. -->
      <button class="btn btn--borderless btn--sm btn--icon control-panel__close" id="cp-close" type="button" aria-label="Close">
        <svg class="lexicon-icon"><use href="#times"></use></svg>
      </button>

      <!-- Dark / Light switch — moon (→ dark) / sun (→ light), with tooltip -->
      <span class="cp-tip">
        <button class="btn btn--borderless btn--sm btn--icon" id="cp-theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
          <svg class="lexicon-icon" id="cp-theme-icon"><use href="#moon"></use></svg>
        </button>
        <span class="tooltip tooltip--top cp-tip__bubble" id="cp-theme-tip" role="tooltip">Switch to dark mode</span>
      </span>
    </div>
  </div>

  <div class="control-panel__search">
    <div class="search">
      <input class="input__field search__field" type="search" placeholder="Search">
      <button class="search__clear" aria-label="Clear" hidden type="button">
        <svg class="lexicon-icon"><use href="#times-circle-full"></use></svg>
      </button>
      <button class="search__submit" aria-label="Search" type="button">
        <svg class="lexicon-icon"><use href="#search"></use></svg>
      </button>
    </div>
  </div>

  <div class="control-panel__body">
    <ul class="control-panel__groups">

      <!-- Home (active) -->
      <li class="control-panel__group">
        <button class="control-panel__item is-active" type="button">
          <span class="control-panel__item-icon">

var SOURCE_LABEL = { site:'Site', library:'Asset Library', space:'Space' };

/* ============================ state ============================ */
var state = {
  activeTab:'site',
  context:{ site:'Liferay.com', library:'Marketing Assets', space:'Customer Success' },
  folder:{ site:'site-root', library:'lib-root', space:'sp-root' },
  search:{ site:'', library:'', space:'' },

  sort:{ site:'name-asc', library:'name-asc', space:'name-asc' },
  selection:null,
  url:{ url:'' },
  dialogOpen:true
};
var uploadedIds = new Set();
var uploadCounter = 0;

var SORT_OPTIONS = [
  { value:'name-asc',      label:'Name (A-Z)' },
  { value:'name-desc',     label:'Name (Z-A)' },
  { value:'modified-desc', label:'Last modified' },
  { value:'modified-asc',  label:'Oldest first' }
];

/* ============================ data helpers ============================ */
function findNode(root, id){
  if(root.id === id) return root;
  for(var i=0; i<root.children.length; i++){
    var f = findNode(root.children[i], id);
    if(f) return f;
  }
  return null;
}
function pathTo(root, id, acc){
  acc = acc || [];
  if(root.id === id){ acc.push(root); return acc; }
  for(var i=0; i<root.children.length; i++){
    var res = pathTo(root.children[i], id, acc.concat([root]));
    if(res) return res;
  }
  return null;
}
function fmtDate(d){
  var dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function extToType(ext){
  ext = (ext || '').toLowerCase();
  if(['jpg','jpeg','png','gif','webp','svg','bmp'].indexOf(ext) !== -1) return 'image';
  if(ext === 'pdf') return 'pdf';
  if(['mp4','mov','avi','webm'].indexOf(ext) !== -1) return 'video';
  return 'doc';
}
function formatBytes(bytes){
  if(bytes < 1024) return bytes + ' B';
  var kb = bytes / 1024;
  if(kb < 1024) return kb.toFixed(0) + ' KB';
  return (kb / 1024).toFixed(1) + ' MB';
}
function todayStr(){ return new Date().toISOString().slice(0, 10); }

function currentItems(source){
  var ctx = state.context[source];
  var all = DATA[source].items[ctx] || [];
  var folder = state.folder[source];
  var q = state.search[source].trim().toLowerCase();
  var tf = state.typeFilter[source];
  var out = all.filter(function(it){
    if(!q && it.folder !== folder) return false;
    if(q && it.name.toLowerCase().indexOf(q) === -1) return false;
    if(tf !== 'All types'){
      var itType = (source === 'library' || it.isFile) && TYPE_META[it.type] ? TYPE_META[it.type].label : it.type;
      if(itType !== tf) return false;
    }
    return true;
  });
  var sort = state.sort[source];
  out.sort(function(a, b){
    if(sort === 'name-asc') return a.name.localeCompare(b.name);
    if(sort === 'name-desc') return b.name.localeCompare(a.name);
    if(sort === 'modified-desc') return a.modified < b.modified ? 1 : -1;
    if(sort === 'modified-asc') return a.modified > b.modified ? 1 : -1;
    return 0;
  });
  return out;
}
function folderPathLabel(source, folderId){
  var root = DATA[source].trees[state.context[source]];
  var path = pathTo(root, folderId);
  if(!path) return '';
  return path.slice(1).map(function(n){ return n.name; }).join(' / ');
}

/* ============================ item presentation ============================ */
function itemIcon(source, it){
  if(it.isFile || source === 'library'){
    var meta = TYPE_META[it.type];
    return { iconId: meta.iconId, hue: meta.hue };
  }
  if(source === 'site') return { iconId:'web-content', hue:'--blue' };
  return { iconId:'box-container', hue:'--teal' };
}
function itemMeta(source, it, showPath){
  var base;
  if(it.isFile) base = it.size + ' · ' + fmtDate(it.modified);
  else if(source === 'site') base = it.type + ' · ' + it.author + ' · ' + fmtDate(it.modified);
  else if(source === 'library') base = it.size + ' · ' + fmtDate(it.modified);
  else base = it.type + ' · ' + it.status + ' · ' + fmtDate(it.modified);
  if(showPath){
    var loc = folderPathLabel(source, it.folder);
    base += ' · ' + (loc ? loc : 'Home');
  }
  return base;
}

/* ============================ rendering ============================ */
function renderRail(){
  var tabs = [
    { key:'site',    label:'Site',          iconId:'sites' },
    { key:'library', label:'Asset Library', iconId:'books' },
    { key:'space',   label:'Space',         iconId:'box-container' },
    { key:'url',     label:'URL',           iconId:'link' }
  ];
  document.getElementById('rail').innerHTML = tabs.map(function(t){
    var active = state.activeTab === t.key;
    return '<li class="vert-nav__item' + (active ? ' is-active' : '') + '" data-tab="' + t.key + '"' +
      ' role="button" tabindex="0" aria-pressed="' + (active ? 'true' : 'false') + '">' +
      '<svg class="lexicon-icon vert-nav__icon"><use href="#' + t.iconId + '"></use></svg>' +
      '<span>' + t.label + '</span></li>';
  }).join('');
  document.querySelectorAll('#rail .vert-nav__item').forEach(function(row){
    function go(){ state.activeTab = row.getAttribute('data-tab'); renderAll(); }
    row.addEventListener('click', go);
    row.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); }
    });
  });
}

function pickerHtml(id, opts){
  /* opts: { trigger:'secondary'|'borderless', iconId, text, showText, options:[{value,label}], current, ariaLabel } */
  var triggerClasses = 'btn btn--sm picker__trigger ' +
    (opts.trigger === 'secondary' ? 'btn--secondary' : 'btn--borderless');
  var html = '<div class="picker js-picker" id="' + id + '">';
  html += '<button type="button" class="' + triggerClasses + '" aria-haspopup="listbox" aria-expanded="false"' +
          (opts.ariaLabel ? ' aria-label="' + escapeHtml(opts.ariaLabel) + '"' : '') + '>';
  if(opts.iconId) html += icon(opts.iconId);
  if(opts.text) html += '<span class="picker__trigger-text">' + escapeHtml(opts.text) + '</span>';
  html += icon('caret-bottom');
  html += '</button>';
  html += '<ul class="dropdown" role="listbox">';
  html += opts.options.map(function(o){
    var active = o.value === opts.current;
    return '<li><button type="button" class="dropdown__item' + (active ? ' is-active' : '') + '" role="option"' +
      ' data-value="' + escapeHtml(o.value) + '" aria-selected="' + (active ? 'true' : 'false') + '">' +
      '<svg class="lexicon-icon dropdown__item-icon"' + (active ? '' : ' style="visibility: hidden;"') + '><use href="#check"></use></svg>' +
      '<span class="dropdown__item-text">' + escapeHtml(o.label) + '</span></button></li>';
  }).join('');
  html += '</ul></div>';
  return html;
}

/* CMS breadcrumb: title + depth, always present. The root crumb is the
   context switcher (picker trigger + dropdown). */
function renderCmsBreadcrumb(source){
  var d = DATA[source];
  var contextLabel = source === 'site' ? 'site' : source === 'library' ? 'library' : 'space';
  var root = d.trees[state.context[source]];
  var path = pathTo(root, state.folder[source]) || [root];
  var atRoot = path.length === 1;
  var sep = '<svg class="lexicon-icon cms-breadcrumb__sep"><use href="#slash"></use></svg>';

  var html = '<ol class="cms-breadcrumb">';

  /* Root crumb = context switcher */
  html += '<li class="cms-breadcrumb__item"' + (atRoot ? ' aria-current="page"' : '') + '>';
  html += '<div class="picker js-picker" id="ctxPicker">';
  html += '<button type="button" class="selector-ctx-trigger picker__trigger" aria-haspopup="listbox" aria-expanded="false" title="Change ' + contextLabel + '">' +
    escapeHtml(state.context[source]) + icon('caret-bottom', 'sm') + '</button>';
  var manyContexts = d.contexts.length > 5;
  html += '<ul class="dropdown" role="listbox">';
  if(manyContexts){
    html += '<li class="selector-ctx-filter"><div class="search">' +
      '<input class="input__field search__field" type="search" id="ctxFilterInput" placeholder="Filter ' + contextLabel + 's" aria-label="Filter ' + contextLabel + 's">' +
      '<button class="search__clear" id="ctxFilterClear" aria-label="Clear filter" type="button" hidden>' + icon('times-circle-full') + '</button>' +
      '<button class="search__submit" aria-label="Search" type="button" tabindex="-1">' + icon('search') + '</button>' +
      '</div></li>';
  }
  var options = d.contexts.map(function(c){
    var active = c === state.context[source];
    return '<li><button type="button" class="dropdown__item' + (active ? ' is-active' : '') + '" role="option"' +
      ' data-value="' + escapeHtml(c) + '" aria-selected="' + (active ? 'true' : 'false') + '">' +
      '<svg class="lexicon-icon dropdown__item-icon"' + (active ? '' : ' style="visibility: hidden;"') + '><use href="#check"></use></svg>' +
      '<span class="dropdown__item-text">' + escapeHtml(c) + '</span></button></li>';
  }).join('');
  if(manyContexts){
    html += '<li><ul class="selector-ctx-list" id="ctxList">' + options + '</ul></li>';
    html += '<li class="dropdown__caption selector-ctx-empty" id="ctxEmpty" hidden>No ' + contextLabel + 's found.</li>';
  } else {
    html += options;
  }
  html += '</ul></div>';
  if(!atRoot) html += sep;
  html += '</li>';

  /* Folder crumbs */
  path.slice(1).forEach(function(n, i){
    var isLast = i === path.length - 2;
    if(isLast){
      html += '<li class="cms-breadcrumb__item" aria-current="page"><span>' + escapeHtml(n.name) + '</span></li>';
    } else {
      html += '<li class="cms-breadcrumb__item"><a href="#" data-crumb="' + n.id + '">' + escapeHtml(n.name) + '</a>' + sep + '</li>';
    }
  });

  html += '</ol>';
  return html;
}

function renderPagination(count){
  var pageSize = 10;
  var pages = Math.max(1, Math.ceil(count / pageSize));
  var html = '<nav class="pagination" aria-label="Pagination">';
  html += '<button class="pagination__size btn btn--borderless btn--sm" type="button">' +
          pageSize + ' Entries ' + icon('caret-bottom') + '</button>';
  html += '<span class="pagination__summary">Showing 1 to ' + Math.min(pageSize, count) + ' of ' + count + ' entries.</span>';
  html += '<ul class="pagination__pages">';
  html += '<li><button class="pagination__btn" type="button" aria-label="Previous" disabled>' + icon('angle-left') + '</button></li>';
  for(var p=1; p<=Math.min(pages, 3); p++){
    html += '<li><button class="pagination__btn' + (p === 1 ? ' is-active" aria-current="page' : '') + '" type="button">' + p + '</button></li>';
  }
  if(pages > 4) html += '<li><span class="pagination__ellipsis">…</span></li>';
  if(pages > 3) html += '<li><button class="pagination__btn" type="button">' + pages + '</button></li>';
  html += '<li><button class="pagination__btn" type="button" aria-label="Next"' + (pages === 1 ? ' disabled' : '') + '>' + icon('angle-right') + '</button></li>';
  html += '</ul></nav>';
  return html;
}

function renderContentTab(source){
  var d = DATA[source];
  var isSearching = !!state.search[source].trim();

  /* CMS breadcrumb — always present, above the FDS block */
  var html = '<div class="selector-crumbs">' + renderCmsBreadcrumb(source) + '</div>';

  /* Toolbar (FDS) */
  html += '<div class="management-toolbar selector-toolbar"><div class="management-toolbar__bar">';
  html += pickerHtml('typePicker', {
    trigger:'borderless', iconId:'filter', text:'Filter',
    options:d.typeOptions.map(function(t){ return { value:t, label:t }; }),
    current:state.typeFilter[source], ariaLabel:'Filter by type'
  });
  html += pickerHtml('sortPicker', {
    trigger:'borderless', iconId:'order-list-down', text:'Order',
    options:SORT_OPTIONS, current:state.sort[source], ariaLabel:'Order'
  });
  html += '<div class="management-toolbar__search"><div class="search">' +
    '<input class="input__field search__field" type="search" id="searchInput" placeholder="Search ' +
    escapeHtml(SOURCE_LABEL[source].toLowerCase()) + '…" value="' + escapeHtml(state.search[source]) + '">' +
    '<button class="search__clear" id="searchClear" aria-label="Clear search" type="button"' + (state.search[source] ? '' : ' hidden') + '>' + icon('times-circle-full') + '</button>' +
    '<button class="search__submit" aria-label="Search" type="button">' + icon('search') + '</button>' +
    '</div></div>';
  if(source === 'library' || source === 'site'){
    html += '<button class="btn btn--primary btn--sm" id="uploadBtn" type="button">' + icon('plus') + 'New</button>';
    html += '<input type="file" id="fileInput" multiple accept="image/*,.pdf,.doc,.docx,.mp4,.mov,.avi,.webm" hidden>';
  }
  html += '<button class="btn btn--borderless btn--sm btn--icon" type="button" aria-label="Switch view">' + icon('cards2') + '</button>';
  html += '</div>';

  /* Results bar (FDS) while searching */
  if(isSearching){
    var resultCount = currentItems(source).length;
    html += '<div class="management-toolbar__results">' +
      '<span class="management-toolbar__results-text">' +
      resultCount + ' result' + (resultCount === 1 ? '' : 's') + ' found for <strong>"' + escapeHtml(state.search[source].trim()) + '"</strong> in ' + escapeHtml(state.context[source]) +
      '</span>' +
      '<button class="management-toolbar__results-clear" id="resultsClear" type="button">Clear</button>' +
      '</div>';
  }
  html += '</div>';

  /* Content */
  var isFiltering = state.typeFilter[source] !== 'All types';
  var root = DATA[source].trees[state.context[source]];
  var currentNode = findNode(root, state.folder[source]);
  var subfolders = (isSearching || isFiltering) ? [] : currentNode.children;
  var allItemsInCtx = DATA[source].items[state.context[source]] || [];
  var items = currentItems(source);

  html += '<div class="selector-scroll" id="scrollArea">';

  if(subfolders.length === 0 && items.length === 0){
    html += '<div class="empty-state empty-state--sm" style="margin: var(--spacing-9) auto;">' +
      '<div class="empty-state__media"><img src="../illustrations/illustration-telescope.svg" alt=""></div>' +
      '<h3 class="empty-state__title">No folders or items found</h3>' +
      '<p class="empty-state__text">Try a different folder, search term, or type filter.</p>' +
      '</div>';
  } else {
    if(subfolders.length){
      html += '<span class="selector-group-label">Folders</span>';
      html += '<ul class="list">';
      subfolders.forEach(function(node){
        var count = allItemsInCtx.filter(function(it){ return it.folder === node.id; }).length;
        html += '<li class="list__row folder-row" data-navigate="' + node.id + '">' +
          '<span class="list__sticker">' + icon('folder') + '</span>' +
          '<div class="list__content">' +
            '<span class="list__title">' + escapeHtml(node.name) + '</span>' +
            '<span class="list__subtitle">' + (count > 0 ? (count + ' item' + (count === 1 ? '' : 's')) : 'Folder') + '</span>' +
          '</div>' +
          '<div class="list__actions">' + icon('angle-right') + '</div>' +
          '</li>';
      });
      html += '</ul>';
    }
    if(items.length){
      html += '<span class="selector-group-label">' + escapeHtml(SOURCE_LABEL[source]) + '</span>';
      html += '<div class="selector-grid">';
      items.forEach(function(it){
        var sel = state.selection && state.selection.source === source && state.selection.id === it.id;
        var isNew = uploadedIds.has(it.id);
        var ic = itemIcon(source, it);
        html += '<article class="card asset-card' + (sel ? ' is-selected' : '') + '" data-id="' + it.id + '" tabindex="0" role="button" aria-pressed="' + (sel ? 'true' : 'false') + '">';
        html += '<label class="radio card__select" aria-label="Select">' +
          '<input class="radio__input" type="radio" name="asset-selection"' + (sel ? ' checked' : '') + '>' +
          '<span class="radio__box"></span></label>';
        html += '<div class="card__media">' +
          '<svg class="lexicon-icon" style="color: var(' + ic.hue + ');"><use href="#' + ic.iconId + '"></use></svg>' +
          '<span class="sticker sticker--md sticker--circle asset-card__author">' +
            '<svg class="lexicon-icon" style="width: 16px; height: 16px;"><use href="#user"></use></svg></span>' +
          '</div>';
        html += '<div class="card__body">' +
          '<h3 class="card__title">' + escapeHtml(it.name) + '</h3>' +
          '<p class="card__subtitle">' + itemMeta(source, it, isSearching) + '</p>' +
          (isNew ? '<span class="label label--sm label--success">New</span>' : '') +
          '</div>';
        html += '</article>';
      });
      html += '</div>';
    }
  }

  /* Pagination — part of the scrollable FDS flow (Clay has no divider) */
  html += '<div class="selector-pagination">' + renderPagination(items.length) + '</div>';

  if(source === 'library' || source === 'site'){
    html += '<div class="selector-dropzone" id="dropOverlay">' + icon('upload', 'lg') +
      '<span>Drop files to upload to<br><strong>' + escapeHtml(currentNode.name) + '</strong></span></div>';
  }
  html += '</div>';
  return html;
}

/* ── URL tab ── */
function isValidUrl(u){ return /^https?:\/\/.+\..+/i.test(u.trim()); }
function filenameFromUrl(u){
  var path = u.split('?')[0].split('#')[0];
  var last = path.substring(path.lastIndexOf('/') + 1);
  return last || u;
}
function previewHtml(trimmed){
  if(!trimmed || !isValidUrl(trimmed)){
    return '<div class="empty-state empty-state--sm">' +
      '<div class="empty-state__media">' + icon('picture', '2xl') + '</div>' +
      '<p class="empty-state__text">' + (!trimmed ? 'Paste an image URL to preview it here.' : 'Waiting for a valid URL…') + '</p>' +
      '</div>';
  }
  return '<img id="previewImg" alt="" hidden>' +
    '<div class="empty-state empty-state--sm" id="previewFallback">' +
    '<div class="empty-state__media">' + icon('document-image', '2xl') + '</div>' +
    '<h3 class="empty-state__title" style="overflow-wrap: anywhere;">' + escapeHtml(filenameFromUrl(trimmed)) + '</h3>' +
    '<p class="empty-state__text">Preview renders once this URL is reachable.</p>' +
    '</div>';
}
function wirePreviewImg(){
  var img = document.getElementById('previewImg');
  if(!img) return;
  img.addEventListener('load', function(){
    img.hidden = false;
    var fb = document.getElementById('previewFallback');
    if(fb) fb.hidden = true;
  });
  img.src = state.url.url.trim();
}
function renderUrlTab(){
  var trimmed = state.url.url.trim();
  var invalid = trimmed && !isValidUrl(trimmed);
  var html = '<div class="selector-crumbs"><ol class="cms-breadcrumb">' +
    '<li class="cms-breadcrumb__item" aria-current="page"><span>External URL</span></li>' +
    '</ol></div>';
  html += '<div class="selector-scroll"><div class="selector-url-form">';
  html += '<label class="input' + (invalid ? ' input--danger' : '') + '">' +
    '<span class="input__label">External Image URL</span>' +
    '<input type="url" class="input__field" id="urlInput" placeholder="https://example.com/photo.jpg" value="' + escapeHtml(state.url.url) + '">' +
    (invalid ? '<span class="input__feedback">' + icon('times-circle-full') + 'Enter a full URL starting with http:// or https://</span>'
             : '<span class="input__help">Direct link to a publicly reachable image.</span>') +
    '</label>';
  html += '<div class="selector-preview" id="imagePreview">' + previewHtml(trimmed) + '</div>';
  html += '</div></div>';
  return html;
}

function renderPanel(){
  /* Re-rendering replaces the scroll container — keep the user's position
     (selection clicks must not move the scroll). Navigation resets it via
     renderAll(). */
  var prevScroll = document.getElementById('scrollArea');
  var scrollTop = prevScroll ? prevScroll.scrollTop : 0;
  var panel = document.getElementById('panel');
  panel.innerHTML = state.activeTab === 'url' ? renderUrlTab() : renderContentTab(state.activeTab);
  attachPanelEvents();
  var nextScroll = document.getElementById('scrollArea');
  if(nextScroll) nextScroll.scrollTop = scrollTop;
}

function renderFooter(){
  var info = document.getElementById('footerInfo');
  var footer = document.getElementById('modalFooter');
  var selectBtn = document.getElementById('selectBtn');

  function paintSelected(name, onClear){
    footer.classList.add('is-active-selection');
    info.innerHTML = '<span class="selector-footer-text"><strong>' + escapeHtml(name) + '</strong> File Selected</span>' +
      '<button class="btn btn--borderless btn--sm" id="clearSelectionBtn" type="button">Clear</button>';
    document.getElementById('clearSelectionBtn').addEventListener('click', onClear);
    selectBtn.disabled = false;
  }
  function paintEmpty(hint){
    footer.classList.remove('is-active-selection');
    info.innerHTML = '<span class="selector-footer-hint">' + hint + '</span>';
    selectBtn.disabled = true;
  }

  if(state.activeTab === 'url'){
    var trimmedUrl = state.url.url.trim();
    if(isValidUrl(trimmedUrl)){
      paintSelected(filenameFromUrl(trimmedUrl), function(){
        state.url.url = '';
        renderPanel();
        renderFooter();
      });
    } else {
      paintEmpty('Paste a full image URL to continue.');
    }
    return;
  }
  if(state.selection){
    paintSelected(state.selection.name, function(){
      state.selection = null;
      renderPanel();
      renderFooter();
    });
  } else {
    paintEmpty('Choose an item to continue.');
  }
}

function renderAll(){
  renderRail();
  renderPanel();
  renderFooter();
  /* Navigation (tab / context / folder / search reset) starts at the top */
  var sc = document.getElementById('scrollArea');
  if(sc) sc.scrollTop = 0;
}

/* ============================ uploads ============================ */
function handleFiles(source, fileList){
  var ctx = state.context[source];
  var folderId = state.folder[source];
  var arr = DATA[source].items[ctx];
  var added = [];
  Array.prototype.forEach.call(fileList, function(f){
    var ext = f.name.indexOf('.') !== -1 ? f.name.split('.').pop() : '';
    var id = 'up' + (++uploadCounter);
    var item = { id:id, name:f.name, type:extToType(ext), folder:folderId, size:formatBytes(f.size), modified:todayStr(), isFile:true };
    arr.push(item);
    uploadedIds.add(id);
    added.push(item);
  });
  if(added.length){
    var folderNode = findNode(DATA[source].trees[ctx], folderId);
    showToast('Uploaded ' + added.length + ' file' + (added.length === 1 ? '' : 's') + ' to ' + (folderNode ? folderNode.name : 'this folder'));
    renderAll();
  }
}

/* ============================ events ============================ */
function closeAllPickers(except){
  document.querySelectorAll('.js-picker.is-open').forEach(function(p){
    if(p !== except){
      p.classList.remove('is-open');
      var t = p.querySelector('.picker__trigger');
      if(t) t.setAttribute('aria-expanded', 'false');
    }
  });
}
document.addEventListener('click', function(e){
  var trigger = e.target.closest('.js-picker .picker__trigger');
  if(trigger){
    var picker = trigger.closest('.js-picker');
    closeAllPickers(picker);
    var open = picker.classList.toggle('is-open');
    trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    /* Context dropdown with a filter row: reset + focus it on open */
    var filterInput = picker.querySelector('.selector-ctx-filter input');
    if(open && filterInput){
      filterInput.value = '';
      filterInput.dispatchEvent(new Event('input'));
      filterInput.focus();
    }
    return;
  }
  if(!e.target.closest('.js-picker')) closeAllPickers();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeAllPickers();
});

function wirePicker(id, onPick){
  var picker = document.getElementById(id);
  if(!picker) return;
  picker.querySelectorAll('.dropdown__item').forEach(function(item){
    item.addEventListener('click', function(){
      closeAllPickers();
      onPick(item.getAttribute('data-value'));
    });
  });
}
function focusEnd(input){ var v = input.value; input.focus(); input.value = ''; input.value = v; }

function attachPanelEvents(){
  var source = state.activeTab;

  if(source === 'site' || source === 'library' || source === 'space'){
    wirePicker('ctxPicker', function(v){
      state.context[source] = v;
      state.folder[source] = DATA[source].trees[v].id;
      state.search[source] = '';
      renderAll();
    });
    /* Live filter for the context dropdown (shown when there are many contexts) */
    var ctxFilter = document.getElementById('ctxFilterInput');
    if(ctxFilter){
      var ctxFilterClear = document.getElementById('ctxFilterClear');
      ctxFilter.addEventListener('input', function(){
        var q = ctxFilter.value.trim().toLowerCase();
        var any = false;
        document.querySelectorAll('#ctxList > li').forEach(function(li){
          var match = li.textContent.toLowerCase().indexOf(q) !== -1;
          li.hidden = !match;
          if(match) any = true;
        });
        document.getElementById('ctxEmpty').hidden = any;
        ctxFilterClear.hidden = !ctxFilter.value;
      });
      ctxFilterClear.addEventListener('click', function(){
        ctxFilter.value = '';
        ctxFilter.dispatchEvent(new Event('input'));
        ctxFilter.focus();
      });
    }
    wirePicker('typePicker', function(v){ state.typeFilter[source] = v; renderPanel(); });
    wirePicker('sortPicker', function(v){ state.sort[source] = v; renderPanel(); });

    var searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', function(){
      state.search[source] = searchInput.value;
      renderPanel();
      focusEnd(document.getElementById('searchInput'));
    });
    document.getElementById('searchClear').addEventListener('click', function(){
      state.search[source] = '';
      renderPanel();
    });
    var resultsClear = document.getElementById('resultsClear');
    if(resultsClear) resultsClear.addEventListener('click', function(){
      state.search[source] = '';
      renderPanel();
    });

    if(source === 'library' || source === 'site'){
      var uploadBtn = document.getElementById('uploadBtn');
      var fileInput = document.getElementById('fileInput');
      uploadBtn.addEventListener('click', function(){ fileInput.click(); });
      fileInput.addEventListener('change', function(){
        if(fileInput.files.length) handleFiles(source, fileInput.files);
        fileInput.value = '';
      });

      var dropWrap = document.getElementById('scrollArea');
      var overlay = document.getElementById('dropOverlay');
      var dragCounter = 0;
      dropWrap.addEventListener('dragenter', function(e){ e.preventDefault(); dragCounter++; overlay.classList.add('is-active'); });
      dropWrap.addEventListener('dragover', function(e){ e.preventDefault(); });
      dropWrap.addEventListener('dragleave', function(){ dragCounter = Math.max(0, dragCounter - 1); if(dragCounter === 0) overlay.classList.remove('is-active'); });
      dropWrap.addEventListener('drop', function(e){
        e.preventDefault();
        dragCounter = 0;
        overlay.classList.remove('is-active');
        if(e.dataTransfer && e.dataTransfer.files.length) handleFiles(source, e.dataTransfer.files);
      });
    }

    document.querySelectorAll('.selector-crumbs [data-crumb]').forEach(function(cr){
      cr.addEventListener('click', function(e){
        e.preventDefault();
        state.folder[source] = cr.getAttribute('data-crumb');
        state.search[source] = '';
        renderAll();
      });
    });
    document.querySelectorAll('.folder-row').forEach(function(row){
      row.addEventListener('click', function(e){
        e.preventDefault();
        state.folder[source] = row.getAttribute('data-navigate');
        state.search[source] = '';
        renderAll();
      });
    });
    document.querySelectorAll('.asset-card').forEach(function(card){
      function pick(){
        var id = card.getAttribute('data-id');
        var it = (DATA[source].items[state.context[source]] || []).find(function(x){ return x.id === id; });
        state.selection = { source:source, id:id, name:it.name, iconId:itemIcon(source, it).iconId };
        renderPanel();
        renderFooter();
      }
      card.addEventListener('click', pick);
      card.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(); }
      });
    });
  }

  if(source === 'url'){
    var urlInput = document.getElementById('urlInput');
    wirePreviewImg();
    var urlDebounceTimer = null;
    urlInput.addEventListener('input', function(){
      state.url.url = urlInput.value;
      renderFooter();
      clearTimeout(urlDebounceTimer);
      urlDebounceTimer = setTimeout(function(){
        if(state.activeTab !== 'url') return;
        renderPanel();
        var again = document.getElementById('urlInput');
        if(again) focusEnd(again);
      }, 400);
    });
  }
}

/* ============================ toast ============================ */
var toastTimer = null;
function showToast(text){
  var t = document.getElementById('toast');
  document.getElementById('toastText').textContent = text;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 2600);
}

/* ============================ dialog open/close ============================ */
function setDialogOpen(open){
  state.dialogOpen = open;
  document.getElementById('dialogLayer').hidden = !open;
  document.getElementById('reopenWrap').hidden = open;
}
document.getElementById('closeBtn').addEventListener('click', function(){
  setDialogOpen(false);
  showToast('Dialog closed');
});
document.getElementById('cancelBtn').addEventListener('click', function(){
  setDialogOpen(false);
  showToast('Selection discarded');
});
document.getElementById('reopenBtn').addEventListener('click', function(){ setDialogOpen(true); });

document.getElementById('selectBtn').addEventListener('click', function(){
  var label;
  var field = document.getElementById('pbFieldValue');
  if(state.activeTab === 'url'){
    var trimmedUrl = state.url.url.trim();
    label = filenameFromUrl(trimmedUrl);
    field.textContent = label + ' (' + trimmedUrl + ')';
  } else if(state.selection){
    label = state.selection.name;
    field.textContent = label;
  } else return;
  field.classList.remove('is-empty');
  setDialogOpen(false);
  showToast('Selected “' + label + '”');
});

/* ============================ modern sidebar (from prototypes/modern-sidebar.html) ============================ */

/* Collapsible Control Panel groups */
(function () {
  document.querySelectorAll('.control-panel__group-header').forEach(function (btn) {
    var chevron = btn.querySelector('svg.lexicon-icon:last-child');
    if (chevron) chevron.style.transition = 'transform 150ms ease';

    var group = btn.parentElement;
    var items = group ? Array.from(group.querySelectorAll('.control-panel__item')) : [];

    if (btn.getAttribute('aria-expanded') === 'false') {
      items.forEach(function (el) { el.style.display = 'none'; });
      if (chevron) chevron.style.transform = 'rotate(-90deg)';
    }

    btn.addEventListener('click', function () {
      var expanded = btn.getAttribute('aria-expanded') !== 'false';
      var next = !expanded;
      btn.setAttribute('aria-expanded', String(next));
      items.forEach(function (el) { el.style.display = next ? '' : 'none'; });
      if (chevron) chevron.style.transform = next ? '' : 'rotate(-90deg)';
    });
  });
})();

/* Pin / peek behaviour — hover the menu toggle to peek, click to pin */
(function () {
  var body = document.body;
  var toggle = document.getElementById('cp-toggle');
  var toggleIcon = document.getElementById('cp-toggle-icon');
  var panel = document.getElementById('control-panel');
  var close = document.getElementById('cp-close');
  var toggleTip = document.getElementById('cp-toggle-tip');
  var hideTimer = null;
  var mqMobile = window.matchMedia('(max-width: 767px)');

  function pinned() { return body.classList.contains('sb-pinned'); }

  function setIcon() {
    var p = pinned();
    var use = toggleIcon && toggleIcon.querySelector('use');
    if (use) use.setAttribute('href', p ? '#product-menu-open' : '#product-menu-closed');
    var label = p ? 'Close Menu' : 'Pin Menu';
    if (toggleTip) toggleTip.textContent = label;
    toggle.setAttribute('aria-label', label);
  }

  function setPinned(on) {
    body.classList.toggle('sb-pinned', on);
    if (on) body.classList.remove('sb-peek');
    toggle.setAttribute('aria-expanded', String(on));
    setIcon();
  }

  function peek(on) {
    if (pinned()) return;
    if (on && mqMobile.matches) return;
    body.classList.toggle('sb-peek', on);
    if (!on) document.dispatchEvent(new CustomEvent('cp:panel-collapsed'));
  }

  function scheduleHide() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { peek(false); }, 250);
  }
  function cancelHide() { clearTimeout(hideTimer); }

  [toggle, panel].forEach(function (el) {
    el.addEventListener('mouseenter', function () { cancelHide(); peek(true); });
    el.addEventListener('mouseleave', scheduleHide);
  });

  toggle.addEventListener('click', function (e) {
    if (pinned()) {
      setPinned(false);
      if (!mqMobile.matches && (toggle.matches(':hover') || panel.matches(':hover'))) body.classList.add('sb-peek');
    } else {
      setPinned(true);
      if (e.detail === 0) panel.focus();
    }
  });

  close.addEventListener('click', function (e) {
    setPinned(false);
    body.classList.remove('sb-peek');
    if (e.detail === 0) toggle.focus();
  });

  var scrim = document.getElementById('cp-scrim');
  if (scrim) scrim.addEventListener('click', function () {
    setPinned(false);
    body.classList.remove('sb-peek');
  });

  /* Selecting a nav item moves the active highlight; on mobile it also
     closes the drawer. (The Control Menu title stays — it names the
     Page Builder context behind the selector.) */
  document.querySelectorAll('.control-panel__item').forEach(function (item) {
    item.addEventListener('click', function () {
      var current = document.querySelector('.control-panel__item.is-active');
      if (current) current.classList.remove('is-active');
      item.classList.add('is-active');
      if (mqMobile.matches) { setPinned(false); body.classList.remove('sb-peek'); }
    });
  });

  panel.addEventListener('focusin', function () { cancelHide(); peek(true); });
  panel.addEventListener('focusout', function (e) {
    if (!panel.contains(e.relatedTarget)) scheduleHide();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && body.classList.contains('sb-peek')) peek(false);
  });

  /* Tooltip timing: show after a short hover delay, self-dismiss, hide on
     leave, reset on click so it can reappear with the new label. */
  if (toggleTip) {
    var TIP_SHOW = 400, TIP_AUTOHIDE = 3000;
    var tipShowT = null, tipHideT = null, tipPointerFocus = false;
    var showTip = function () {
      toggleTip.classList.add('is-visible');
      clearTimeout(tipHideT);
      tipHideT = setTimeout(function () { toggleTip.classList.remove('is-visible'); }, TIP_AUTOHIDE);
    };
    var hideTip = function () {
      clearTimeout(tipShowT); clearTimeout(tipHideT);
      toggleTip.classList.remove('is-visible');
    };
    var deferTip = function () {
      clearTimeout(tipShowT);
      tipShowT = setTimeout(showTip, TIP_SHOW);
    };
    toggle.addEventListener('mouseenter', deferTip);
    toggle.addEventListener('mouseleave', hideTip);
    toggle.addEventListener('mousedown', function () { tipPointerFocus = true; });
    toggle.addEventListener('focus', function () { if (!tipPointerFocus) showTip(); tipPointerFocus = false; });
    toggle.addEventListener('blur', hideTip);
    toggle.addEventListener('click', function () {
      hideTip();
      if (toggle.matches(':hover')) deferTip();
    });
  }

  setIcon();
})();

/* Dark / Light switch (panel header) */
(function () {
  var SKINS = ['light', 'light-hc', 'dark', 'dark-hc'];
  var btn = document.getElementById('cp-theme-toggle');
  var themeIcon = document.getElementById('cp-theme-icon');
  var tip = document.getElementById('cp-theme-tip');
  if (!btn) return;

  function current() {
    var r = document.documentElement;
    for (var i = 0; i < SKINS.length; i++) { if (r.classList.contains(SKINS[i])) return SKINS[i]; }
    return 'light';
  }

  function render() {
    var isDark = current().indexOf('dark') === 0;
    var use = themeIcon.querySelector('use');
    if (use) use.setAttribute('href', isDark ? '#sun' : '#moon');
    var label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
    btn.setAttribute('aria-label', label);
    btn.setAttribute('aria-pressed', String(isDark));
    if (tip) tip.textContent = label;
  }

  btn.addEventListener('click', function () {
    var next = current().indexOf('dark') === 0 ? 'light' : 'dark';
    var r = document.documentElement;
    SKINS.forEach(function (c) { r.classList.remove(c); });
    r.classList.add(next);
    try { localStorage.setItem('vanilla-skin', next); } catch (e) {}
    render();
  });

  render();
})();

/* User menu — open upward from the footer trigger */
(function () {
  var wrap = document.querySelector('.cp-user');
  var trigger = document.getElementById('cp-user-trigger');
  if (!wrap || !trigger) return;

  function open() { return wrap.classList.contains('is-open'); }

  function setOpen(on) {
    wrap.classList.toggle('is-open', on);
    trigger.setAttribute('aria-expanded', String(on));
  }

  trigger.addEventListener('click', function () { setOpen(!open()); });

  document.addEventListener('click', function (e) {
    if (open() && !wrap.contains(e.target)) setOpen(false);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && open()) { setOpen(false); trigger.focus(); }
  });

  wrap.querySelectorAll('.dropdown__item').forEach(function (item) {
    item.addEventListener('click', function () { setOpen(false); });
  });

  document.addEventListener('cp:panel-collapsed', function () { setOpen(false); });
})();

/* Scroll shadows — only while the panel body is clipped past that edge */
(function () {
  var panel = document.getElementById('control-panel');
  var body = panel && panel.querySelector('.control-panel__body');
  if (!body) return;

  function update() {
    var clippedTop = body.scrollTop > 1;
    var clippedBottom = body.scrollTop + body.clientHeight < body.scrollHeight - 1;
    panel.classList.toggle('is-clipped-top', clippedTop);
    panel.classList.toggle('is-clipped-bottom', clippedBottom);
  }

  body.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);

  if (window.ResizeObserver) {
    var groups = body.querySelector('.control-panel__groups');
    if (groups) new ResizeObserver(update).observe(groups);
  }

  update();
})();

/* ============================ init ============================ */
renderAll();
