<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Pin the canvas + browser-chrome colour so Chromium-based browsers that
       tint their own UI (Dia, Arc) don't flicker white→dark while the external
       stylesheets load. Not the scrim: the scrim stays opacity:0 at rest. -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF">
  <title>Unified Navigation — Lexicon Vanilla</title>

  <script>(function(){
    var S=['light','light-hc','dark','dark-hc'];
    function apply(){try{
      var r=document.documentElement;
      var s=localStorage.getItem('vanilla-skin')||'light';
      S.forEach(function(c){r.classList.remove(c);});
      r.classList.add(S.indexOf(s)>-1?s:'light');
      if(localStorage.getItem('vanilla-cms-style')==='1'){
        r.style.setProperty('--rounded-sm','4px');
        r.style.setProperty('--rounded-md','8px');
        r.style.setProperty('--rounded-lg','16px');
      }else{
        r.style.removeProperty('--rounded-sm');
        r.style.removeProperty('--rounded-md');
        r.style.removeProperty('--rounded-lg');
      }
    }catch(e){}}
    apply();
    window.addEventListener('pageshow',apply);
  })()</script>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../tokens-high-contrast.css">
  <link rel="stylesheet" href="../tokens-dark.css">
  <link rel="stylesheet" href="../components.css">
  <script src="../icons.js"></script>

  <style>
    /* Page-scoped kit tweaks (same as modern-sidebar.html — the kit default
       stays --rounded-md; do not promote back): 8px sticker corners. */
    .sticker { border-radius: var(--rounded-lg); }
    .sticker--sm { font-size: var(--font-size-xs); border-radius: var(--rounded-md); }

    /* Page-level tokens. Typography is the kit default (--font-family-base
       from tokens.css — the system stack); no page-level font override.
       · --sidebar-width: single source of truth for the docked panel width
         (consumed by the panel, main's pinned margin, and the control-menu
         title's pinned shift). Overriding it re-widens all three at once.
       · --cp-chrome-h: shared chrome height so the panel header stays locked
         to the control-menu bar. Drops to 48px in the compact breakpoint
         (see the @media block near the bottom of this stylesheet); the
         control-menu already compacts to 48px in that range on its own
         (components.css), so both stay in sync via the token. */
    :root {
      --sidebar-width: 280px;
      /* Match the control-menu's *content band* so the panel-header contents
         (title, theme/close) share the toggle's vertical centre. The bar is the
         32px toggle (spacing-8) + 2×12px vertical padding (spacing-4) = 56px —
         the canonical DXP chrome height (the kit's 36px avatar produces the same
         56px; this prototype moved the avatar to the footer, so we pin the band
         via padding instead). Its 1px bottom border sits below the centred
         content, so it doesn't shift the centre. */
      --cp-chrome-h: calc(var(--spacing-8) + 2 * var(--spacing-4)); /* 56px */
    }

    /* Bigger shell titles: Top Bar title and Side Menu header. */
    .control-menu__title,
    .control-panel--floating .control-panel__title {
      font-size: var(--font-size-lg);
    }

    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Modern sidebar (docked drawer) ──────────────────────────
       The Control Panel sits flush to the screen edge, full height.
       Three states:
         · hidden   — default when unpinned
         · sb-peek  — hover on the menu toggle reveals it as overlay
         · sb-pinned— click on the toggle docks it; content shifts  */
    .control-panel--floating {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--sidebar-width);
      z-index: 50;
      /* Right border only — the panel sits flush to the screen edge, so a
         left border would paint a stray 1px line along it. The border lives
         in every state (never toggled on pin) to avoid the 1px content-box
         flicker. */
      border-right: 1px solid var(--color-secondary-l2);
      /* Hidden state: short 24px slide + fade. The corner button sits above the
         panel (z-index), so only the panel body slides/fades beneath a
         stationary button. Visibility flips after the fade so it can't catch
         the pointer. */
      transform: translateX(calc(-1 * var(--spacing-7)));
      opacity: 0;
      visibility: hidden;
      transition: transform 140ms ease-out, opacity 140ms ease-out,
                  visibility 0s linear 140ms, box-shadow 140ms ease;
    }
    body.sb-pinned .control-panel--floating,
    body.sb-peek .control-panel--floating {
      transform: translateX(0);
      opacity: 1;
      visibility: visible;
      transition: transform 140ms ease-out, opacity 140ms ease-out,
                  visibility 0s, box-shadow 140ms ease;
    }
    /* Peek overlays the content → elevated; pinned sits in the layout → flat. */
    body.sb-peek:not(.sb-pinned) .control-panel--floating { box-shadow: var(--shadow-lg); }

    /* Mobile scrim: dims the content behind a pinned panel and closes it on
       tap. z-index sits above the content but below the panel (50) and the
       toggle (60), so both stay live. Hidden by default here; the compact
       @media below reveals it only while pinned (desktop pins push the layout,
       so no scrim is needed there). */
    .cp-scrim {
      position: fixed;
      inset: 0;
      background: var(--color-scrim);
      z-index: 45;
      opacity: 0;
      visibility: hidden;
      transition: opacity 140ms ease-out, visibility 0s linear 140ms;
    }

    /* Top-bar padding: 12px on all four sides. Vertical 12 gives the 56px
       chrome band (32px toggle + 2×12); the 12px left inset drops the toggle's
       icon centre to 28px, matching the panel items' icon centres below (item
       content sits at 16px + a 24px icon box → 28px centre). Overrides the
       kit's 10px/16px base. */
    .control-menu { padding: var(--spacing-4); }

    /* The menu toggle never moves: it stays in the Control Menu flow but
       paints above the floating panel (z-index), becoming part of its header
       row, so the panel body can dissolve beneath a stationary button. */
    .control-menu__btns { position: relative; z-index: 60; }
    /* 8px between the toggle and the Top Bar title (matches the Side Menu
       header's button→title gap). */
    .control-menu__left { gap: var(--spacing-3); }

    /* 8px corners on the top-bar buttons, so the whole chrome shares the user
       button / header-action radius. Radius only — the toggle's position stays
       pinned for the pin/unpin effect. */
    .control-menu__btn { border-radius: var(--rounded-lg); }

    /* ── One static toggle, content swaps by state ───────────────
       A single button paints above the floating panel (z-index) and never
       moves. Closed → menu icon (top-bar look). Panel out (peek/pinned) →
       brand image at rest, menu icon on hover/focus. On close only the panel
       body dissolves beneath the stationary button — no button vanishes or
       reappears. Fixed 32×32 so image (32px sticker) and icon (16px, centred)
       never shift it. */
    .cp-toggle--branded {
      width: var(--spacing-8);
      height: var(--spacing-8);
      padding: 0;
    }
    /* The product icon carries its own artwork on transparency — drop the
       sticker's default fill so no grey shows behind its margins. The image
       src is swapped per environment (product icon or site thumbnail). */
    .cp-toggle__brand { background: transparent; }
    /* Product icons: 20px frame version (Figma Lexicon Satellites › Icons,
       3981:3), centred in the 32px toggle. Site thumbnails fill it. */
    .cp-toggle__brand.is-product > img {
      height: var(--spacing-6);
      object-fit: contain;
      width: var(--spacing-6);
    }

    /* Closed (button reads as the top-bar toggle): menu icon, never the image. */
    #cp-toggle .cp-toggle__brand { display: none; }
    #cp-toggle #cp-toggle-icon { display: block; }

    /* Pinned: the toggle reads as active. light-d1 (#E2E4EA) reads too
       strong here, so soften it: 8% of --color-dark over the white bar
       ≈ #EEEEEF, and the token flips per skin (a light tint in dark mode).
       Hover doesn't override it. */
    body.sb-pinned #cp-toggle,
    body.sb-pinned #cp-toggle:hover {
      background: color-mix(in srgb, var(--color-dark) 8%, transparent);
    }

    /* Panel peeked (unpinned): the button reads as the panel's header button →
       brand image at rest; on hover / keyboard focus it swaps to the menu icon
       (what the click will do). Pinned: no image swap — the base rules above
       keep the menu icon (product-menu-open → "click closes") at all times. */
    body.sb-peek:not(.sb-pinned) #cp-toggle .cp-toggle__brand { display: inline-flex; }
    body.sb-peek:not(.sb-pinned) #cp-toggle #cp-toggle-icon { display: none; }
    body.sb-peek:not(.sb-pinned) #cp-toggle:hover .cp-toggle__brand,
    body.sb-peek:not(.sb-pinned) #cp-toggle:focus-visible .cp-toggle__brand { display: none; }
    body.sb-peek:not(.sb-pinned) #cp-toggle:hover #cp-toggle-icon,
    body.sb-peek:not(.sb-pinned) #cp-toggle:focus-visible #cp-toggle-icon { display: block; }

    /* Header row geometry: height comes from --cp-chrome-h (56 normal, 48
       compact) so it stays locked to the control-menu bar. Left padding
       clears the menu toggle overlaying this corner and leaves an 8px
       button→title gap: toggle box now starts at 12px (bar padding) and is
       32px wide → title at 12 + 32 + 8 = 52px (spacing-10 + spacing-2). The
       compact @media below tightens it to match the control-menu's own
       narrower horizontal padding at that width. */
    .control-panel--floating .control-panel__header {
      height: var(--cp-chrome-h);
      padding: 0 var(--spacing-4) 0 calc(var(--spacing-10) + var(--spacing-2));
    }
    .control-panel--floating .control-panel__search {
      padding-top: var(--spacing-4);
      padding-left: var(--spacing-6);   /* 20px inset from the panel edges (base is 16px) */
      padding-right: var(--spacing-6);
    }

    /* Compact 32px search across both breakpoints — the kit default input
       field is 40px, but the panel reads better with a slimmer field. The
       kit's 16px side padding feels too airy at 32px tall, so tighten the
       left inset to 12 (right stays wide for the icons — 64px, set by
       .search__field). */
    .control-panel--floating .control-panel__search .input__field {
      height: var(--spacing-8);
      padding-left: var(--spacing-4);
    }

    /* Tighter rhythm between section groups (base is --spacing-5). */
    .control-panel--floating .control-panel__groups { gap: var(--spacing-3); }

    /* Section-header chevron sits 20px from the panel's right edge (base is
       --spacing-5 / 16px). */
    .control-panel--floating .control-panel__group-header { padding-right: var(--spacing-6); }

    /* ── Modern scrollbar ───────────────────────────────────────
       Thin floating pill, no track. The 2px transparent border +
       background-clip insets a 4px thumb inside an 8px gutter. The
       secondary scale is defined per skin, so it follows dark/HC. */
    .control-panel__body,
    main {
      scrollbar-width: thin;
      scrollbar-color: var(--color-secondary-l2) transparent;
    }
    .control-panel__body::-webkit-scrollbar,
    main::-webkit-scrollbar { width: var(--spacing-3); }
    .control-panel__body::-webkit-scrollbar-track,
    main::-webkit-scrollbar-track { background: transparent; }
    .control-panel__body::-webkit-scrollbar-thumb,
    main::-webkit-scrollbar-thumb {
      background: var(--color-secondary-l2);
      background-clip: padding-box;
      border: var(--spacing-1) solid transparent;
      border-radius: var(--rounded-full);
    }
    .control-panel__body::-webkit-scrollbar-thumb:hover,
    main::-webkit-scrollbar-thumb:hover {
      background-color: var(--color-secondary-l0);
      background-clip: padding-box;
    }

    /* Pinned: page content and Control Menu title make room. */
    /* Content shift on pin/unpin: ease-out quint — fast start that
       decelerates into place, so the reflow reads as one soft glide. */
    main { transition: margin-left 320ms cubic-bezier(0.22, 1, 0.36, 1); }
    body.sb-pinned main { margin-left: var(--sidebar-width); }
    .control-menu__title { transition: margin-left 320ms cubic-bezier(0.22, 1, 0.36, 1); }
    /* Title rests at x 56 (16px bar padding + 32px toggle + 8px gap); the
       panel's right edge is at --sidebar-width. Shift the title so it clears
       the panel with a 24px gap from the panel edge. */
    body.sb-pinned .control-menu__title {
      margin-left: calc(var(--sidebar-width) - var(--spacing-8));
    }

    /* ── Pinned user footer ─────────────────────────────────────
       Sibling of .control-panel__body inside the flex-column panel, so
       it stays docked at the bottom while the nav list scrolls. Top
       border echoes the panel's own right border. */
    .control-panel__footer {
      flex-shrink: 0;
      padding: var(--spacing-3);
      /* Sits above the scrolling body so its scroll shadow paints over the
         list content, not under it. */
      position: relative;
      z-index: 1;
      transition: box-shadow 150ms ease;
    }
    /* Scroll shadows — only while the body is clipped past that edge (classes
       toggled in JS). The search is the true top edge of the fixed chrome (it
       sits between the header and the list), so the downward shadow lives there
       rather than on the header, where the opaque search box would hide it. */
    .control-panel__search {
      position: relative;
      z-index: 1;
      transition: box-shadow 150ms ease;
    }
    #control-panel.is-clipped-top .control-panel__search {
      box-shadow: var(--shadow-scroll-top);
    }
    #control-panel.is-clipped-bottom .control-panel__footer {
      box-shadow: var(--shadow-scroll-bottom);
    }

    /* Anchor for the upward-opening menu. */
    .cp-user { position: relative; }

    /* Borderless dropdown trigger: avatar + name + caret, full width. */
    .cp-user__trigger {
      align-items: center;
      appearance: none;
      background: none;
      border: 0;
      border-radius: var(--rounded-lg);
      color: var(--color-dark);
      cursor: pointer;
      /* Inline-flex → the button hugs its content (avatar + name + caret)
         instead of stretching across the footer. */
      display: inline-flex;
      font-family: var(--font-family-base);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semi);
      /* Mirror a nav item's rail: 8px footer pad + 8px trigger pad = 16px, so
         the 24px avatar sits exactly on the item icon-box (16–40px); an 8px gap
         then lands the name at 48px, on the item-label column. */
      gap: var(--spacing-3);
      padding: var(--spacing-3);
      text-align: left;
    }
    .cp-user__trigger:hover { background: var(--color-light); }
    /* Menu open → the trigger stays "marked", using the same soft tint as the
       pinned menu toggle (8% of --color-dark, so it flips per skin). */
    .cp-user.is-open .cp-user__trigger {
      background: color-mix(in srgb, var(--color-dark) 8%, transparent);
    }

    .cp-user__avatar {
      border-radius: var(--rounded-full);
      flex-shrink: 0;
      height: var(--spacing-7);
      overflow: hidden;
      width: var(--spacing-7);
    }
    .cp-user__avatar > img {
      display: block;
      height: 100%;
      object-fit: cover;
      width: 100%;
    }

    .cp-user__name {
      white-space: nowrap;
    }

    /* Caret rests pointing down; flips up while the menu is open. */
    .cp-user__caret {
      color: var(--color-secondary-l0);
      flex-shrink: 0;
      transition: transform 150ms ease;
    }
    .cp-user__trigger[aria-expanded="true"] .cp-user__caret { transform: rotate(180deg); }

    /* Menu opens upward from the footer, spanning the panel width. Capped
       height keeps it inside tall panels; the list scrolls if it overflows. */
    .cp-user__menu {
      position: absolute;
      bottom: calc(100% + var(--spacing-2));
      left: 0;
      right: 0;
      max-height: 70vh;
      overflow-y: auto;
      border-radius: var(--rounded-lg);
      z-index: 30;
    }
    .cp-user:not(.is-open) .cp-user__menu { display: none; }

    /* ── Compact chrome breakpoint ──────────────────────────────
       The kit already compacts .control-menu to 48px at ≤767px
       (components.css). We match that here by dropping --cp-chrome-h
       and tightening the panel-header padding so the toggle→title gap
       stays visually consistent. Below the same breakpoint the panel
       behaves as an overlay — pinned no longer pushes the layout. The
       panel BODY (items, indent, gaps, icons, typography) stays
       identical at both sizes. */
    @media (max-width: 767px) {
      /* Compact chrome: 8px padding all round, so the band is 32 + 2×8 = 48px —
         keep the header locked to it. */
      :root { --cp-chrome-h: calc(var(--spacing-8) + 2 * var(--spacing-3)); } /* 48px */

      /* 8px padding all round: vertical 8 → 48px band; the 8px side inset (vs
         the kit's 12) keeps the toggle closer to the viewport edge on narrow
         screens. */
      .control-menu {
        padding: var(--spacing-3);
      }

      .control-panel--floating .control-panel__header {
        /* toggle at x = spacing-3 (8) + spacing-8 (32) = 40 → 8px gap
           → title starts at 48 = spacing-10 */
        padding: 0 var(--spacing-3) 0 var(--spacing-10);
      }

      /* Tighter side padding on the search wrapper (16 → 12); vertical
         padding stays as declared above. */
      .control-panel--floating .control-panel__search {
        padding-left: var(--spacing-4);
        padding-right: var(--spacing-4);
      }

      /* Slightly smaller display face on the two shell titles — both keep
         their ellipsis (already declared on the base .control-menu__title
         and .control-panel__title rules). */
      .control-menu__title,
      .control-panel--floating .control-panel__title {
        font-size: var(--font-size-md);
      }

      /* Overlay-only pinned: no push, no title shift. */
      body.sb-pinned main { margin-left: 0; }
      body.sb-pinned .control-menu__title { margin-left: 0; }

      /* Scrim visible only while the panel is pinned at this width. */
      body.sb-pinned .cp-scrim {
        opacity: 1;
        visibility: visible;
        transition: opacity 140ms ease-out, visibility 0s;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .control-panel--floating, main, .control-menu__title { transition: none; }
    }

    /* ── Empty-state illustration in dark skins ─────────────────
       The SVG ships hardcoded light grays and loads via <img>, so it
       can't see tokens. The filter chain re-maps whites/grays into
       dark blue-tinted tones that sit well on the dark surfaces. */
    .dark .empty-state__media img,
    .dark-hc .empty-state__media img {
      filter: invert(0.8) sepia(0.8) hue-rotate(198deg) saturate(1) brightness(0.52);
    }

    /* ── Header action buttons ──────────────────────────────────
       Theme switch + Close, pinned to the right of the title. */
    .control-panel__actions {
      align-items: center;
      display: flex;
      flex-shrink: 0;
      gap: var(--spacing-2);
      margin-left: auto;
    }
    /* 8px corners on the header action buttons (theme / close), matching the
       user button and the dropdown menu. */
    .control-panel__actions .btn { border-radius: var(--rounded-lg); }

    /* Close button: behaves like Bootstrap's visually-hidden-focusable.
       While it lacks keyboard focus it is pulled out of flow (position:
       absolute → no longer a flex item), so it reserves no space and no
       gap. On keyboard focus it snaps back into the row at full size.
       It is first in the DOM (first Tab stop) but `order` renders it last. */
    .control-panel__close { order: 1; }
    .control-panel__close:not(:focus-visible) {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    /* The panel receives focus (tabindex=-1) when opened by keyboard; it is
       a deliberate jump, so suppress the container outline. */
    .control-panel:focus { outline: none; }

    /* ── Hover / focus tooltip ──────────────────────────────────
       Reuses the .tooltip component visual; the wrapper anchors it
       below the button and reveals it on hover or keyboard focus. */
    .cp-tip { position: relative; display: inline-flex; }
    .cp-tip__bubble {
      position: absolute;
      top: calc(100% + var(--spacing-2));
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
      z-index: 20;
    }
    /* Show on hover or *keyboard* focus only — a plain :focus-within would
       pin the tooltip after a mouse click, since the button keeps focus. */
    .cp-tip:hover .cp-tip__bubble,
    .cp-tip:has(:focus-visible) .cp-tip__bubble { opacity: 1; }

    /* Toggle sits at the screen's left edge → left-align its tooltip so it
       opens rightward with the arrow near the left (tooltip--align-start puts
       the arrow 12px in; offset the bubble so that arrow points at the button
       centre). */
    #cp-toggle-tip { left: var(--spacing-2); transform: none; }
    /* JS-controlled visibility (timed show / auto-hide / reset on click); the
       ID specificity overrides the shared .cp-tip:hover/:focus-within rule. */
    #cp-toggle-tip { opacity: 0; }
    #cp-toggle-tip.is-visible { opacity: 1; }

    /* ════════════════════════════════════════════════════════════
       GLOBAL MENU — candidate satellite (.global-menu)
       Spec: Confluence PEDS "Global Menu" · Figma Lexicon Satellites
       › Global Menu Components & Variants (4928:9068).
       240px dropdown panel (Figma: 280), rounded-lg (8px), dropdown shadow. Blocks
       (products · divider · admin · sites) stack with an 8px gap.
       ════════════════════════════════════════════════════════════ */
    :root { --global-menu-width: 240px; }

    .gm { position: relative; }

    /* Trigger: secondary borderless `grid` button that stays active while
       the menu is open (same soft 8% tint as the pinned toggle). */
    .gm__trigger { border-radius: var(--rounded-lg); }
    /* Solid (8% dark over white) rather than a transparent tint: on mobile
       the trigger sits above the overlay while the bar behind it doesn't,
       so a see-through fill would show the overlay and look dimmed. Same
       colour as the tint on the white bar, in every skin. */
    .gm__trigger[aria-expanded="true"],
    .gm__trigger[aria-expanded="true"]:hover {
      background: color-mix(in srgb, var(--color-dark) 8%, var(--color-white));
      color: var(--color-dark);
    }

    .global-menu {
      position: absolute;
      top: calc(100% + var(--spacing-2));
      right: 0;
      z-index: 70;
      width: var(--global-menu-width);
      max-height: calc(100vh - var(--cp-chrome-h));
      overflow-y: auto;
      background: var(--color-white);
      border-radius: var(--rounded-lg);
      box-shadow: var(--shadow-dropdown);
      font-family: var(--font-family-base);
    }
    .gm:not(.is-open) .global-menu { display: none; }

    .global-menu ul { list-style: none; margin: 0; padding: 0; }

    /* ── 1. Products + Admin ── 16px top, 8px between items and around
       the divider, 8px before the Sites block. */
    .global-menu .global-menu__products {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-3);
      padding: var(--spacing-5) 0 var(--spacing-3);
    }
    .global-menu__divider {
      border-top: 1px solid var(--color-secondary-l3);
    }

    /* Shared item: 16px sides, 4px vertical, 8px sticker→label gap. */
    .global-menu__item {
      align-items: center;
      appearance: none;
      background: transparent;
      border: 0;
      color: var(--color-dark);
      cursor: pointer;
      display: flex;
      font-family: inherit;
      /* Kit tokens are shifted one step lighter than Figma (normal = 300,
         semi = 400, bold = 600), so Figma "Regular 400" maps to --semi and
         "Semibold 600" to --bold. */
      font-weight: var(--font-weight-semi);
      gap: var(--spacing-3);
      line-height: 1.5;
      min-height: var(--spacing-8);
      padding: var(--spacing-2) var(--spacing-5);
      text-align: left;
      width: 100%;
    }
    .global-menu__item:hover { background: var(--color-primary-l3); }
    .global-menu__item.is-active {
      background: var(--color-primary-l3);
      font-weight: var(--font-weight-bold);
      box-shadow: inset var(--spacing-2) 0 0 var(--color-primary-l0);
    }
    /* Focus = inner ring, keeps the hover fill. */
    .global-menu__item:focus-visible {
      outline: 2px solid var(--color-primary-l0);
      outline-offset: -2px;
      background: var(--color-primary-l3);
    }

    /* Product item: 32px · 20px product icon in a 24px sticker (2px pad)
       · 16px regular $dark. */
    .global-menu__item--product { font-size: var(--font-size-md); }
    .global-menu__sticker {
      background: transparent;
      padding: var(--spacing-1);
    }
    .global-menu__sticker > img { object-fit: contain; }

    /* ── 2. Sites area ── light surface, 16px vertical, 8px label→list. */
    .global-menu__sites {
      background: var(--color-light-l1);
      border-top: 1px solid var(--color-secondary-l3);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-3);
      padding: var(--spacing-5) 0;

    .global-menu__section {
      color: var(--color-secondary);
      display: block;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
      line-height: 1.25;
      padding: 0 var(--spacing-5);
      text-transform: uppercase;
    }
    /* Site item: 32px · 24px sticker (rounded-lg) · 14px regular $primary.
       Items stack flush (no gap). Long names wrap. */
    .global-menu__item--site {
      color: var(--color-primary);
      font-size: var(--font-size-base);
    }
    .global-menu__item--site .sticker {
      align-self: flex-start;
      background: var(--color-white);
      border-radius: var(--rounded-lg);
      flex-shrink: 0;
    }
    /* Global site sticker: blue-l5 tint + 12px globe glyph. */
    .global-menu__item--site .global-menu__sticker--global,
    .global-menu__sticker--global {
      background: var(--blue-l5);
      color: var(--color-primary);
    }
    /* Site logo (vector mark, not a photo): 16px inside the 24px sticker so
       it balances with the 12px Global glyph and the 20px product icons. */
    .global-menu__sticker--logo { padding: var(--spacing-2); }
    .global-menu__sticker--logo > img { object-fit: contain; }
    /* View All Sites: no sticker, primary-d1. */
    .global-menu__item--all { color: var(--color-primary-d1); }

    /* Side Menu separator before the secondary navigation (e.g. Recycle Bin). */
    .sm-divider {
      border-top: 1px solid var(--color-secondary-l3);
      margin: 0 var(--spacing-5);
    }

    /* Mobile-only overlay (spec: $dark-l2, 0.8). Blocks the page and the
       Side Menu; the top bar's right cluster stays above it so the trigger
       can dismiss the menu. */
    .gm-scrim {
      position: fixed;
      inset: 0;
      z-index: 65;
      background: color-mix(in srgb, var(--color-dark-l2) 80%, transparent);
      opacity: 0;
      visibility: hidden;
      transition: opacity 140ms ease-out, visibility 0s linear 140ms;
    }
    .control-menu__right { position: relative; z-index: 66; }
    @media (max-width: 767px) {
      body.gm-open .gm-scrim {
        opacity: 1;
        visibility: visible;
        transition: opacity 140ms ease-out, visibility 0s;
      }
      .global-menu { max-width: calc(100vw - 2 * var(--spacing-2)); }
    }

    /* Environment switch: brief fade on the page placeholder so the jump
       reads as a context change. */
    /* ── Environment home ── */
    /* Only the media sits in flow, so the icon is the thing that gets
       centred and it never moves between environments. The copy hangs
       below it (absolute) and grows downward when the tagline wraps. */
    .env-home {
      display: flex;
      position: relative;
      /* Fixed lift ≈ half the copy block (title + one tagline line), so the
         group reads optically centred. Constant → still no jump on switch. */
      transform: translateY(calc(-1 * var(--spacing-10)));
    }
    .env-home__copy {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-3);
      left: 50%;
      position: absolute;
      text-align: center;
      top: calc(100% + var(--spacing-5));
      transform: translateX(-50%);
      width: calc(10 * var(--spacing-10));   /* 480px */
      max-width: calc(100vw - 2 * var(--spacing-7));
    }
    #page-body:not(.is-home) .env-home,
    #page-body.is-home #page-empty { display: none; }
    /* 80px: the 40px product artwork at 2×. Sites show their thumbnail;
       Global its globe glyph on the blue-l5 tile (as in the Global Menu). */
    .env-home__media {
      align-items: center;
      border-radius: var(--rounded-xl);
      display: inline-flex;
      height: calc(2 * var(--spacing-9));
      justify-content: center;
      overflow: hidden;
      width: calc(2 * var(--spacing-9));

    .env-home__media > img { display: block; height: 100%; object-fit: contain; width: 100%; }
    .env-home__media.is-site > img { object-fit: cover; }
    .env-home__media.is-global {
      background: var(--blue-l5);
      color: var(--color-primary);
    }
    .env-home__media.is-global .lexicon-icon { height: var(--spacing-9); width: var(--spacing-9); }
    .env-home__title {
      color: var(--color-dark);
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-bold);
      margin: 0;
    }
    .env-home__text {
      color: var(--color-secondary);
      font-size: var(--font-size-md);
      margin: 0;
      max-width: 40ch;
    }

    #page-body { transition: opacity 160ms ease; }
    #page-body.is-switching { opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      #page-body { transition: none; }

<!-- Collapsible Side Menu groups — delegated, because the nav is re-rendered
     on every environment switch. Initial state comes from aria-expanded. -->
<script>
  (function () {
    function sync(btn) {
      var open = btn.getAttribute('aria-expanded') !== 'false';
      var chevron = btn.querySelector('svg.lexicon-icon:last-child');
      if (chevron) {
        chevron.style.transition = 'transform 150ms ease';
        chevron.style.transform = open ? '' : 'rotate(-90deg)';
      }
      btn.parentElement.querySelectorAll('.control-panel__item').forEach(function (el) {
        el.style.display = open ? '' : 'none';
      });
    }
    window.syncSideMenuGroups = function (root) {
      root.querySelectorAll('.control-panel__group-header').forEach(sync);
    };
    document.getElementById('sm-groups').addEventListener('click', function (e) {
      var btn = e.target.closest('.control-panel__group-header');
      if (!btn) return;
      btn.setAttribute('aria-expanded', String(btn.getAttribute('aria-expanded') === 'false'));
      sync(btn);
    });
  })();
</script>

<!-- Pin / peek behaviour — hover the menu toggle to peek, click to pin -->
<script>
  (function () {
    var body = document.body;
    var toggle = document.getElementById('cp-toggle');
    var toggleIcon = document.getElementById('cp-toggle-icon');
    var panel = document.getElementById('control-panel');
    var close = document.getElementById('cp-close');
    var toggleTip = document.getElementById('cp-toggle-tip');
    var hideTimer = null;
    // Below this width the panel is a tap-driven drawer: no hover peek, and
    // selecting a nav item closes it.
    var mqMobile = window.matchMedia('(max-width: 767px)');

    function pinned() { return body.classList.contains('sb-pinned'); }

    function setIcon() {
      var p = pinned();
      var use = toggleIcon && toggleIcon.querySelector('use');
      if (use) use.setAttribute('href', p ? '#product-menu-open' : '#product-menu-closed');
      // Tooltip + accessible name follow the action the click will perform.
      var label = p ? 'Close Menu' : 'Pin Menu';
      if (toggleTip) toggleTip.textContent = label;
      toggle.setAttribute('aria-label', label);
    }

    function setPinned(on) {
      body.classList.toggle('sb-pinned', on);
      if (on) body.classList.remove('sb-peek');
      toggle.setAttribute('aria-expanded', String(on));
      setIcon();
    }

    function peek(on) {
      if (pinned()) return;
      // Mobile has no hover peek — only tap-to-pin opens the drawer.
      if (on && mqMobile.matches) return;
      body.classList.toggle('sb-peek', on);
      // Retracting an unpinned (hover) panel resets any transient state inside
      // it — e.g. an open user menu — so the next peek starts from default.
      if (!on) document.dispatchEvent(new CustomEvent('cp:panel-collapsed'));
    }

    // Small grace period so the pointer can travel toggle → panel
    function scheduleHide() {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () { peek(false); }, 250);
    }
    function cancelHide() { clearTimeout(hideTimer); }

    [toggle, panel].forEach(function (el) {
      el.addEventListener('mouseenter', function () { cancelHide(); peek(true); });
      el.addEventListener('mouseleave', scheduleHide);
    });

    toggle.addEventListener('click', function (e) {
      if (pinned()) {
        setPinned(false);
        // Pointer is still over the trigger/panel → degrade to overlay
        // instead of vanishing under the cursor. Never on mobile (no peek).
        if (!mqMobile.matches && (toggle.matches(':hover') || panel.matches(':hover'))) body.classList.add('sb-peek');
      } else {
        setPinned(true);
        // Keyboard activation (Enter/Space) reports detail === 0. When opened
        // that way, move focus into the panel so the next Tab lands on Close.
        if (e.detail === 0) panel.focus();
      }
    });

    // Closing from inside the panel returns focus to the menu toggle.
    close.addEventListener('click', function (e) {
      setPinned(false);
      body.classList.remove('sb-peek');
      if (e.detail === 0) toggle.focus();
    });

    // Tapping the mobile scrim closes the panel (visible/interactive only
    // below the breakpoint while pinned — a no-op elsewhere).
    var scrim = document.getElementById('cp-scrim');
    if (scrim) scrim.addEventListener('click', function () {
      setPinned(false);
      body.classList.remove('sb-peek');
    });

    // Selecting a nav item updates the Control Menu title + active highlight
    // (all sizes); on mobile it also closes the drawer (scrim retracts with it).
    // Delegated: the nav list is re-rendered per environment.
    document.getElementById('sm-groups').addEventListener('click', function (e) {
      var item = e.target.closest('.control-panel__item');
      if (!item) return;
      window.selectSideMenuItem(item);
      if (mqMobile.matches) { setPinned(false); body.classList.remove('sb-peek'); }
    });

    // Keyboard parity with hover: focus inside the panel keeps it revealed.
    panel.addEventListener('focusin', function () { cancelHide(); peek(true); });
    panel.addEventListener('focusout', function (e) {
      if (!panel.contains(e.relatedTarget)) scheduleHide();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && body.classList.contains('sb-peek')) peek(false);
    });

    // Tooltip timing: show after a short hover delay, self-dismiss after a
    // while (even if still hovered), hide the instant the pointer leaves, and
    // on click hide + reset the delay so it can reappear with the new label.
    if (toggleTip) {
      var TIP_SHOW = 400, TIP_AUTOHIDE = 3000;
      var tipShowT = null, tipHideT = null, tipPointerFocus = false;
      var showTip = function () {
        toggleTip.classList.add('is-visible');
        clearTimeout(tipHideT);
        tipHideT = setTimeout(function () { toggleTip.classList.remove('is-visible'); }, TIP_AUTOHIDE);
      };
      var hideTip = function () {
        clearTimeout(tipShowT); clearTimeout(tipHideT);
        toggleTip.classList.remove('is-visible');
      };
      var deferTip = function () {
        clearTimeout(tipShowT);
        tipShowT = setTimeout(showTip, TIP_SHOW);
      };
      toggle.addEventListener('mouseenter', deferTip);
      toggle.addEventListener('mouseleave', hideTip);
      // Show at once on keyboard focus, but not when focus came from a click.
      toggle.addEventListener('mousedown', function () { tipPointerFocus = true; });
      toggle.addEventListener('focus', function () { if (!tipPointerFocus) showTip(); tipPointerFocus = false; });
      toggle.addEventListener('blur', hideTip);
      toggle.addEventListener('click', function () {
        hideTip();
        if (toggle.matches(':hover')) deferTip();
      });
    }

    setIcon();
  })();
</script>

<!-- Dark / Light switch -->
<script>
  (function () {
    var SKINS = ['light', 'light-hc', 'dark', 'dark-hc'];
    var btn = document.getElementById('cp-theme-toggle');
    var icon = document.getElementById('cp-theme-icon');
    var tip = document.getElementById('cp-theme-tip');
    if (!btn) return;

    function current() {
      try { return localStorage.getItem('vanilla-skin') || 'light'; } catch (e) { return 'light'; }
    }

    function render() {
      var isDark = current().indexOf('dark') === 0;
      // Moon → "switch to dark" (light now); Sun → "switch to light" (dark now)
      var use = icon.querySelector('use');
      if (use) use.setAttribute('href', isDark ? '#sun' : '#moon');
      var label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
      btn.setAttribute('aria-label', label);
      btn.setAttribute('aria-pressed', String(isDark));
      if (tip) tip.textContent = label;
    }

    btn.addEventListener('click', function () {
      var next = current().indexOf('dark') === 0 ? 'light' : 'dark';
      var r = document.documentElement;
      SKINS.forEach(function (c) { r.classList.remove(c); });
      r.classList.add(next);
      try { localStorage.setItem('vanilla-skin', next); } catch (e) {}
      render();
    });

    render();
  })();
</script>

<!-- User menu — open upward from the footer trigger, close on outside click / Esc -->
<script>
  (function () {
    var wrap = document.querySelector('.cp-user');
    var trigger = document.getElementById('cp-user-trigger');
    if (!wrap || !trigger) return;

    function open() { return wrap.classList.contains('is-open'); }

    function setOpen(on) {
      wrap.classList.toggle('is-open', on);
      trigger.setAttribute('aria-expanded', String(on));
    }

    trigger.addEventListener('click', function () { setOpen(!open()); });

    // Outside click closes the menu.
    document.addEventListener('click', function (e) {
      if (open() && !wrap.contains(e.target)) setOpen(false);
    });

    // Esc closes and returns focus to the trigger.
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && open()) { setOpen(false); trigger.focus(); }
    });

    // Selecting a menu item closes the menu (prototype: no navigation).
    wrap.querySelectorAll('.dropdown__item').forEach(function (item) {
      item.addEventListener('click', function () { setOpen(false); });
    });

    // An unpinned panel retracting (hover-out / Esc) resets the menu to
    // default, so re-peeking never surfaces a stale open menu.
    document.addEventListener('cp:panel-collapsed', function () { setOpen(false); });
  })();
</script>

<!-- Scroll shadows — reveal the header/footer edge shadow only while the nav
     list is clipped past that edge (clean when everything fits). -->
<script>
  (function () {
    var panel = document.getElementById('control-panel');
    var body = panel && panel.querySelector('.control-panel__body');
    if (!body) return;

    function update() {
      // 1px slack absorbs sub-pixel rounding at the extremes.
      var clippedTop = body.scrollTop > 1;
      var clippedBottom = body.scrollTop + body.clientHeight < body.scrollHeight - 1;
      panel.classList.toggle('is-clipped-top', clippedTop);
      panel.classList.toggle('is-clipped-bottom', clippedBottom);
    }

    body.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);

    // Expanding / collapsing a group changes the scrollable height.
    if (window.ResizeObserver) {
      var groups = body.querySelector('.control-panel__groups');
      if (groups) new ResizeObserver(update).observe(groups);
    }

    update();
  })();
</script>

<!-- ════════════════════════════════════════════════════════════════
     Environments + Global Menu
     ─ ENVS is the single source of truth: each entry feeds the Global
       Menu item, the Side Menu (brand, title, nav) and the page.
     ─ Current environment lives in location.hash (#/cms, #/site-global…),
       so reloads keep it and Back/Forward walks the jumps — file:// safe.
     ════════════════════════════════════════════════════════════════ -->
<script>
  (function () {
    // nav entries:
    //   { item, icon, active? }                       single top-level item
    //   { items: [[label, icon], …], active? }        headerless block (items 4px apart)
    //   { group, open?, items: [[label, icon], …] }   collapsible section
    //                                                 (open is ignored for now: every group
    //                                                 renders expanded to show menu length)
    //   { divider: true }                             separator before secondary nav
    // TODO: replace placeholder navs (AI Hub, Data Platform, Digital Sales Room, sites) with final content.
    var ENVS = {
      // Products area
      'cms': {
        kind: 'product', label: 'Content Management', img: '../product-icons/cms-20.svg', tagline: 'Create, organize and share content across your spaces.',
        nav: [
          { items: [['Home', 'home'], ['Dashboard', 'analytics'], ['Shared with Me', 'users']], active: 'Home' },
          { group: 'Assets', open: true, items: [['All', 'sheets'], ['Contents', 'catalog'], ['Files', 'documents-and-media']] },
          { group: 'Admin', open: true, items: [['Content Structures', 'edit-layout'], ['Categorization', 'vocabulary']] },
          { divider: true },   // secondary navigation
          { items: [['Recycle Bin', 'trash']] }
        ]
      },
      'commerce': {
        kind: 'product', label: 'Commerce', img: '../product-icons/commerce-20.svg', tagline: 'Manage catalogs, orders and shipments.',
        nav: [
          { item: 'Home', icon: 'home', active: true },
          { group: 'Order Management', items: [['Orders', 'order-form'], ['Order Types', 'order-form-tag'], ['Order Rules', 'order-form-pencil'], ['Shipments', 'truck'], ['Subscriptions', 'price-tag'], ['Terms and Conditions', 'signature']] },
          { group: 'Inventory Management', items: [['Inventory', 'squares'], ['Warehouses', 'warehouse']] },
          { group: 'Pricing', items: [['Price Lists', 'price-list'], ['Promotions', 'categories'], ['Discounts', 'percentage-banner'], ['Product Groups', 'archive'], ['Tax Categories', 'calculator']] },
          { group: 'Payment Management', items: [['Payments', 'credit-card']] },
          { group: 'Product Management', items: [['Catalogs', 'catalog'], ['Product Configurations', 'product-configuration'], ['Products', 'products'], ['Options', 'list-ul-rtl'], ['Specifications', 'search-experiences']] },
          { group: 'Store Management', items: [['Channels', 'nodes'], ['Currencies', 'coin']] },
          { group: 'Settings', items: [['Availability Estimates', 'date'], ['Measurement Units', 'decimal'], ['Avalara Connector', 'plug'], ['Health Check', 'heart']] }
        ]
      },
      'ai-hub': {
        kind: 'product', label: 'AI Hub', img: '../product-icons/ai-hub-20.svg', tagline: 'Configure and monitor AI capabilities across the platform.',
        nav: [{ item: 'Home', icon: 'home', active: true }]
      },
      'data-platform': {
        kind: 'product', label: 'Data Platform', img: '../product-icons/data-platform-20.svg', tagline: 'Unify customer data and build audiences.',
        nav: [{ item: 'Home', icon: 'home', active: true }]
      },
      'digital-sales-room': {
        kind: 'product', label: 'Digital Sales Room', img: '../product-icons/digital-sales-room-20.svg', tagline: 'Collaborate with buyers in dedicated sales rooms.',
        nav: [{ item: 'Home', icon: 'home', active: true }]
      },
      // Admin block (after the divider)
      'applications': {
        kind: 'product', admin: true, label: 'Applications', img: '../product-icons/applications-20.svg', tagline: 'Workflow, search tuning, integrations and platform tools.',
        nav: [
          { items: [['Home', 'home'], ['Announcements and Alerts', 'megaphone'], ['Design Libraries', 'books-brush'], ['Launches', 'rocket'], ['Content Site Generator', 'stars']], active: 'Home' },
          { group: 'Workflow', open: true, items: [['Process Builder', 'process-builder'], ['Workflow Metrics', 'polls'], ['Submissions', 'submission']] },
          { group: 'Search', open: true, items: [['Blueprints', 'blue-print'], ['Synonyms', 'synonyms'], ['Result Rankings', 'medal']] },
          { group: 'Developer and Integration', open: true, items: [['Client Extensions', 'puzzle'], ['Export', 'export'], ['Import', 'import']] },
          { group: 'In Maintenance', open: true, items: [['Asset Libraries', 'books'], ['Content Dashboard', 'display-content'], ['Publications', 'publications']] }
        ]
      },
      'control-panel': {
        kind: 'product', admin: true, label: 'Control Panel', img: '../product-icons/control-panel-20.svg', tagline: 'Administer users, sites, configuration and security.',
        nav: [
          { item: 'Home', icon: 'home', active: true },
          { group: 'Users', open: true, items: [['Users and Organizations', 'users'], ['User Groups', 'community'], ['Roles', 'organizations'], ['Monitoring', 'display-content'], ['Service Accounts', 'suitcase']] },
          { group: 'Sites', items: [['Sites', 'sites'], ['Site Templates', 'site-template']] },
          { group: 'Accounts', items: [['Accounts', 'briefcase'], ['Account Users', 'user'], ['Account Groups', 'myspace']] },
          { group: 'Configuration', items: [['System Settings', 'hdd'], ['Instance Settings', 'cog'], ['Push Notifications', 'bell-on'], ['Components', 'box-container'], ['Search', 'search'], ['Custom Fields', 'custom-field'], ['Language Override', 'automatic-translate'], ['Adaptive Media', 'picture'], ['Job Scheduler', 'sheets'], ['Countries', 'flag-full']] },
          { group: 'Notifications', items: [['Templates', 'bell-on'], ['Queue', 'order-list-down']] },
          { group: 'Object', items: [['Objects', 'braces'], ['Picklists', 'list-ol']] },
          { group: 'Security', items: [['Audit', 'search-experiences'], ['OAuth Client Administration', 'shield-check'], ['OAuth 2 Administration', 'shield-check'], ['Password Policies', 'password-policies'], ['SAML Admin', 'lock'], ['Service Access Policy', 'shield-asterisk']] },
          { group: 'System', items: [['Server Administration', 'database'], ['App Manager', 'grid'], ['Gogo Shell', 'code'], ['Virtual Instances', 'display-content'], ['On-Demand Admin', 'submission']] },
          { group: 'Marketplace', items: [['Purchased', 'products'], ['Store', 'shopping-cart'], ['License Manager', 'forms']] }
        ]
      },
      // Sites area
      'site-liferay-dxp': {
        kind: 'site', logo: true, label: 'Liferay DXP Site', img: 'img/site-liferay-dxp.svg', tagline: 'Build and manage the pages and content of this site.',
        nav: siteNav()
      },
      // Global Site: shown only if the user has access — fixed last in the list.
      'site-global': {
        kind: 'site', label: 'Global', icon: 'globe-lines', tagline: 'Content and settings shared by every site.',
        nav: siteNav()
      }
    };

    function siteNav() {
      return [
        { item: 'Home', icon: 'home', active: true },
        { group: 'Site Builder', open: true, items: [['Pages', 'page'], ['Page Templates', 'page-template'], ['Navigation Menus', 'blogs']] },
        { group: 'Content & Data', items: [['Web Content', 'web-content'], ['Documents and Media', 'documents-and-media'], ['Blogs', 'blogs']] },
        { group: 'Configuration', items: [['Site Settings', 'cog'], ['Memberships', 'users']] }
      ];
    }

    var DEFAULT_ENV = 'control-panel';

    var $ = function (id) { return document.getElementById(id); };
    var wrap = $('gm'), trigger = $('gm-trigger'), menu = $('gm-menu');
    var productsEl = $('gm-products'), sitesEl = $('gm-sites'), scrim = $('gm-scrim');
    var current = null;

    function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function icon(name, extra) { return '<svg class="lexicon-icon' + (extra ? ' ' + extra : '') + '"><use href="#' + name + '"></use></svg>'; }

    function sticker(env, size) {
      if (env.icon) {
        return '<span class="sticker' + size + ' global-menu__sticker--global" aria-hidden="true">' + icon(env.icon, 'lexicon-icon-sm') + '</span>';
      }
      var cls = env.kind === 'product' ? ' global-menu__sticker'
              : env.logo ? ' global-menu__sticker--logo' : '';
      return '<span class="sticker' + size + cls + '" aria-hidden="true"><img src="' + env.img + '" alt=""></span>';
    }

    // ── Global Menu ──────────────────────────────────────────────
    function renderMenu() {
      var p = '', s = '', divided = false;
      Object.keys(ENVS).forEach(function (id) {
        var env = ENVS[id];
        if (env.kind === 'product') {
          if (env.admin && !divided) { p += '<li class="global-menu__divider" role="separator"></li>'; divided = true; }
          p += '<li><button type="button" class="global-menu__item global-menu__item--product" data-env="' + id + '">' +
               sticker(env, '') + '<span>' + esc(env.label) + '</span></button></li>';
        } else {
          s += '<li><button type="button" class="global-menu__item global-menu__item--site" data-env="' + id + '">' +
               sticker(env, '') + '<span>' + esc(env.label) + '</span></button></li>';
        }
      });
      // "View All Sites" — same states as a Site Item, no sticker.
      s += '<li><button type="button" class="global-menu__item global-menu__item--site global-menu__item--all" data-action="all-sites">View All Sites</button></li>';
      productsEl.innerHTML = p;
      sitesEl.innerHTML = s;
    }

    function markActive() {
      menu.querySelectorAll('.global-menu__item').forEach(function (b) {
        var on = b.getAttribute('data-env') === current;
        b.classList.toggle('is-active', on);
        if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
      });
    }

    function isOpen() { return wrap.classList.contains('is-open'); }
    function setOpen(on, returnFocus) {
      wrap.classList.toggle('is-open', on);
      document.body.classList.toggle('gm-open', on);
      trigger.setAttribute('aria-expanded', String(on));
      if (on) {
        var first = menu.querySelector('.global-menu__item.is-active') || menu.querySelector('.global-menu__item');
        if (first) first.focus({ preventScroll: true });
      } else if (returnFocus) {
        trigger.focus();
      }
    }

    trigger.addEventListener('click', function () { setOpen(!isOpen(), false); });
    scrim.addEventListener('click', function () { setOpen(false, false); });
    document.addEventListener('click', function (e) {
      if (isOpen() && !wrap.contains(e.target) && e.target !== scrim) setOpen(false, false);
    });
    document.addEventListener('keydown', function (e) {
      if (!isOpen()) return;
      if (e.key === 'Escape') { e.stopPropagation(); setOpen(false, true); return; }
      // Arrow keys move through the items, like a Dropdown Menu.
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Home' || e.key === 'End') {
        var items = Array.prototype.slice.call(menu.querySelectorAll('.global-menu__item'));
        var i = items.indexOf(document.activeElement);
        var n = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1
              : (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        items[n].focus();
        e.preventDefault();
      }
    });

    menu.addEventListener('click', function (e) {
      var b = e.target.closest('.global-menu__item');
      if (!b) return;
      setOpen(false, true);
      if (b.getAttribute('data-action') === 'all-sites') {
        // Prototype: the site directory lives in Control Panel › Sites.
        go('control-panel', 'Sites');
      } else {
        go(b.getAttribute('data-env'));
      }
    });

    // ── Side Menu ────────────────────────────────────────────────
    function itemHtml(label, ic, active) {
      return '<button class="control-panel__item' + (active ? ' is-active' : '') + '" type="button">' +
             '<span class="control-panel__item-icon">' + icon(ic) + '</span>' + esc(label) + '</button>';
    }

    function renderSideMenu(env) {
      var html = '';
      env.nav.forEach(function (n) {
        if (n.divider) { html += '<li class="sm-divider" role="separator"></li>'; return; }
        html += '<li class="control-panel__group">';
        if (n.group) {
          // Review mode: every group starts expanded so each environment's
          // full menu length is visible (groups can still be collapsed).
          html += '<button class="control-panel__group-header" type="button" aria-expanded="true">' +
                  esc(n.group) + icon('angle-down-small') + '</button>';
          n.items.forEach(function (it) { html += itemHtml(it[0], it[1], false); });
        } else if (n.items) {
          n.items.forEach(function (it) { html += itemHtml(it[0], it[1], it[0] === n.active); });
        } else {
          html += itemHtml(n.item, n.icon, n.active);
        }
        html += '</li>';
      });
      var groups = $('sm-groups');
      groups.innerHTML = html;
      window.syncSideMenuGroups(groups);
      $('sm-title').textContent = env.label;

      // Brand in the toggle: product artwork or site thumbnail / glyph.
      var brand = $('env-brand');
      brand.classList.toggle('is-product', env.kind === 'product' || !!env.logo);
      brand.classList.toggle('global-menu__sticker--global', !!env.icon);
      brand.innerHTML = env.icon ? icon(env.icon) : '<img src="' + env.img + '" alt="">';

      var body = document.querySelector('.control-panel__body');
      if (body) body.scrollTop = 0;
    }

    // Home hero: 40px product artwork (same name, -20 → -40), site
    // thumbnail, or the Global globe glyph.
    function renderHome(env) {
      var media = $('env-home-media');
      media.className = 'env-home__media' + (env.kind === 'site' ? ' is-site' : '') + (env.icon ? ' is-global' : '');
      media.innerHTML = env.icon ? icon(env.icon)
        : '<img src="' + (env.kind === 'product' ? env.img.replace('-20.svg', '-40.svg') : env.img) + '" alt="">';
      $('env-home-title').textContent = env.label;
      $('env-home-text').textContent = env.tagline || '';
    }

    // Shared with the pin/peek script: selecting a nav item updates the
    // active highlight, the top-bar title and the page placeholder.
    window.selectSideMenuItem = function (item) {
      var prev = document.querySelector('.control-panel__item.is-active');
      if (prev) prev.classList.remove('is-active');
      item.classList.add('is-active');
      // Reveal the item if it sits inside a collapsed group.
      var header = item.parentElement.querySelector('.control-panel__group-header');
      if (header && header.getAttribute('aria-expanded') === 'false') header.click();
      var label = item.textContent.trim();
      document.querySelector('.control-menu__title').textContent = label;
      // Home greets the environment so each jump lands somewhere distinct.
      var env = ENVS[current];
      var home = label === 'Home' && env;
      $('page-body').classList.toggle('is-home', !!home);
      $('page-title').textContent = label;
      $('page-text').textContent = env ? env.label : '';
      if (home) renderHome(env);
    };

    // ── Environment switch ───────────────────────────────────────
    function apply(id, itemLabel) {
      if (!ENVS[id]) id = DEFAULT_ENV;
      var env = ENVS[id];
      var page = $('page-body');
      page.classList.add('is-switching');
      current = id;
      renderSideMenu(env);
      markActive();
      var target = null;
      if (itemLabel) {
        document.querySelectorAll('#sm-groups .control-panel__item').forEach(function (el) {
          if (!target && el.textContent.trim() === itemLabel) target = el;
        });
      }
      window.selectSideMenuItem(target || document.querySelector('#sm-groups .control-panel__item.is-active') ||
                                document.querySelector('#sm-groups .control-panel__item'));
      document.title = env.label + ' — Unified Navigation';
      requestAnimationFrame(function () { page.classList.remove('is-switching'); });
    }

    // Hash is '#/<env>' — the '/' keeps it from matching element ids
    // (e.g. #control-panel is the aside) and triggering a jump-scroll.
    function hashEnv() { return location.hash.replace(/^#\/?/, ''); }

    // Apply first, then record it in the hash — the UI never depends on
    // hashchange firing (some previews sandbox the URL). Back/Forward
    // lands in hashchange, which skips the env we're already showing.
    function go(id, itemLabel) {
      apply(id, itemLabel);
      if (hashEnv() !== id) { try { location.hash = '/' + id; } catch (e) {} }
    }
    window.addEventListener('hashchange', function () {
      var h = hashEnv() || DEFAULT_ENV;
      if (h !== current) apply(h);
    });

    renderMenu();
    apply(hashEnv() || DEFAULT_ENV);
  })();
</script>
